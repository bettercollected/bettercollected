[project]
name = "bettercollected"
version = "0.1.0"
description = "Typed client and forms-as-code CLI for the BetterCollected public API."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# A copy of the repository's LICENSE: a licence file must sit inside the
# project directory (PEP 639).
license-files = ["LICENSE"]
authors = [{ name = "Sireto B.V." }]
keywords = [
    "bettercollected",
    "forms",
    "forms-as-code",
    "form-builder",
    "privacy",
    "gdpr",
    "api-client",
    "sdk",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://bettercollected.com"
Documentation = "https://bettercollected.com/developers/"
Source = "https://github.com/bettercollected/bettercollected/tree/develop/sdk/python"
Issues = "https://github.com/bettercollected/bettercollected/issues"

[project.scripts]
bettercollected = "bettercollected.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "datamodel-code-generator==0.83.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bettercollected"]

# The sdist holds what the wheel is built from; the tests and the model
# generator read files from the rest of the repository, so they stay there.
[tool.hatch.build.targets.sdist]
only-include = ["src/bettercollected", "README.md", "LICENSE"]

[tool.uv]
# Only releases at least two weeks old when the lock was made.
exclude-newer = "2026-10-03T00:00:00Z"
# Security fixes released after the cut-off.
exclude-newer-package = { certifi = "2026-10-24T00:00:00Z", black = "2026-10-24T00:00:00Z" }

[tool.pytest.ini_options]
testpaths = ["tests"]

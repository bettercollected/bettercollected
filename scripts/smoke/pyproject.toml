[project]
name = "bettercollected-smoke"
version = "1.0.0"
description = "Production smoke test: browser flows and the public API against a dedicated test workspace."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false
# Resolve only releases that have been public for a while (supply chain):
# move this date forward on purpose when upgrading.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Umami (self-hosted analytics). Respondents' browsers load the tracker script and
# post their events here; nothing else of Umami is reachable from the network: its
# dashboard and login are published on 127.0.0.1:3004 only. The address is looked
# up per request (Docker's resolver), so nginx starts before Umami does.
server {
    listen 3003;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $umami_upstream http://umami:3000;
    client_max_body_size 64k;

    location = /script.js {
        limit_except GET HEAD { deny all; }
        proxy_pass $umami_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ ^/api/(send|batch)$ {
        limit_except POST OPTIONS { deny all; }
        proxy_pass $umami_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}

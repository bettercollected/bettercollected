name: CI

on:
    pull_request:
        branches:
            - master
            - develop

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Jobs run on the shared office runners (label `builder`); fork PRs stay
    # on GitHub-hosted runners so code from outside the repository never runs
    # on our machines. The repository variable CI_RUNNER overrides the label
    # (set it to `ubuntu-latest` to go back to GitHub-hosted runners).
    #
    # Service containers publish random host ports, so jobs running side by
    # side on one machine, or next to databases already on it, don't collide.

    # The three persistence modes run as parallel jobs: Mongo only, every group
    # mirrored to Postgres (dual), and every group served from Postgres.
    backend-tests:
        name: Backend tests (pytest, ${{ matrix.mode }})
        runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER || 'builder') || 'ubuntu-latest' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - mode: mongo
                      read_source: ""
                      write_mode: ""
                    - mode: dual
                      read_source: ""
                      write_mode: dual
                    - mode: postgres
                      read_source: postgres
                      write_mode: postgres
        # The backend tests talk to a real MongoDB (Beanie), so provide one.
        # Without it, every DB call blocks on the ~30s ServerSelectionTimeout and
        # the suite runs for many minutes.
        services:
            mongo:
                image: mongo:7
                ports:
                    - 27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
            # A throwaway test database: data on tmpfs, durability off below.
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: bettercollected_test
                ports:
                    - 5432
                options: >-
                    --tmpfs /var/lib/postgresql/data:rw
                    --health-cmd "pg_isready -U postgres -d bettercollected_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        defaults:
            run:
                working-directory: backend
        env:
            VIRTUAL_ENV: ""
            AUTH_AES_HEX_KEY: L5HuSlk0ijI3xzaccuy2x1jnzHNjtTw3zW53tjGHZG0=
            AUTH_JWT_SECRET: c3c66ff889b1deabc35ebb3cf07374f1fd934f0f0185eec076b5bcd874de86d5
            SCHEDULAR_ENABLED: "False"
            API_ENABLE_FORM_CREATION: "True"
            UNSPLASH_ACCESS_KEY: ""
            MASTER_ENCRYPTION_KEYSET: ""
        steps:
            - uses: actions/checkout@v7

            # Durability is pointless for a test database that lives for one job.
            # These settings take effect on reload, no restart needed.
            - name: Tune the test Postgres for speed
              working-directory: .
              run: |
                  docker exec ${{ job.services.postgres.id }} psql -U postgres -d bettercollected_test -v ON_ERROR_STOP=1 \
                      -c "ALTER SYSTEM SET fsync = off" \
                      -c "ALTER SYSTEM SET synchronous_commit = off" \
                      -c "ALTER SYSTEM SET full_page_writes = off" \
                      -c "SELECT pg_reload_conf()" \
                      -c "SHOW fsync" -c "SHOW synchronous_commit" -c "SHOW full_page_writes"

            - name: Set up uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: 3.11.12
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run backend tests (${{ matrix.mode }})
              env:
                  MONGO_URI: mongodb://localhost:${{ job.services.mongo.ports['27017'] }}
                  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/bettercollected_test
                  DB_READ_SOURCE: ${{ matrix.read_source }}
                  DB_WRITE_MODE: ${{ matrix.write_mode }}
              # Four pytest-xdist workers (a hosted runner has 4 vCPUs; more
              # workers measured slower), each with its own Mongo and Postgres
              # database (tests/conftest.py). Not "-n auto": that counts
              # physical cores. loadgroup spreads tests one by one, except
              # modules that share an expensive fixture.
              run: uv run pytest -n 4 --dist loadgroup

    auth-tests:
        name: Auth tests (pytest)
        runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER || 'builder') || 'ubuntu-latest' }}
        # The auth suite uses an in-memory Mongo mock (mongomock-motor), so no Mongo
        # service is needed. Postgres is provided for the repository layer that is
        # replacing Mongo (plans/postgres-consolidation.md).
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: bettercollected_test
                ports:
                    - 5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d bettercollected_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        defaults:
            run:
                working-directory: auth
        steps:
            - uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: 3.11.12
                  enable-cache: true

            - name: Install dependencies
              env:
                  VIRTUAL_ENV: ""
              run: uv sync --frozen

            - name: Run auth tests
              env:
                  VIRTUAL_ENV: ""
                  DOTENV_PATH: /nonexistent.env
                  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/bettercollected_test
                  AUTH_JWT_SECRET: c3c66ff889b1deabc35ebb3cf07374f1fd934f0f0185eec076b5bcd874de86d5
                  AUTH_AES_HEX_KEY: L5HuSlk0ijI3xzaccuy2x1jnzHNjtTw3zW53tjGHZG0=
                  ELASTIC_APM_DISABLE_SEND: "true"
              run: uv run pytest
            - name: Run auth tests (mirrored to Postgres)
              env:
                  VIRTUAL_ENV: ""
                  DOTENV_PATH: /nonexistent.env
                  DB_WRITE_MODE: dual
                  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/bettercollected_test
                  AUTH_JWT_SECRET: c3c66ff889b1deabc35ebb3cf07374f1fd934f0f0185eec076b5bcd874de86d5
                  AUTH_AES_HEX_KEY: L5HuSlk0ijI3xzaccuy2x1jnzHNjtTw3zW53tjGHZG0=
                  ELASTIC_APM_DISABLE_SEND: "true"
              run: uv run pytest
            - name: Run auth tests (served from Postgres)
              env:
                  VIRTUAL_ENV: ""
                  DOTENV_PATH: /nonexistent.env
                  DB_READ_SOURCE: postgres
                  DB_WRITE_MODE: postgres
                  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/bettercollected_test
                  AUTH_JWT_SECRET: c3c66ff889b1deabc35ebb3cf07374f1fd934f0f0185eec076b5bcd874de86d5
                  AUTH_AES_HEX_KEY: L5HuSlk0ijI3xzaccuy2x1jnzHNjtTw3zW53tjGHZG0=
                  ELASTIC_APM_DISABLE_SEND: "true"
              run: uv run pytest
    google-tests:
        name: Google integration tests (pytest)
        # The google unit suite has pre-existing failures from aiohttp/pydantic API
        # drift (tests/unit/app/utils/test_aiohttp_client.py, tests/unit/app/views,
        # tests/unit/app/test_asgi.py) that predate the Postgres work and were never
        # run in CI. This job runs everything else; repairing those is a follow-up.
        runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER || 'builder') || 'ubuntu-latest' }}
        services:
            mongo:
                image: mongo:7
                ports:
                    - 27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: bettercollected_test
                ports:
                    - 5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d bettercollected_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        defaults:
            run:
                working-directory: integrations/google
        steps:
            - uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: 3.11.12
                  enable-cache: true

            - name: Install dependencies
              env:
                  VIRTUAL_ENV: ""
              run: uv sync --frozen

            - name: Run google tests
              env:
                  VIRTUAL_ENV: ""
                  DOTENV_PATH: /nonexistent.env
                  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/bettercollected_test
                  AUTH_JWT_SECRET: c3c66ff889b1deabc35ebb3cf07374f1fd934f0f0185eec076b5bcd874de86d5
                  AUTH_AES_HEX_KEY: L5HuSlk0ijI3xzaccuy2x1jnzHNjtTw3zW53tjGHZG0=
                  ELASTIC_APM_DISABLE_SEND: "true"
                  MONGO_URI: mongodb://localhost:${{ job.services.mongo.ports['27017'] }}
                  MONGO_DB: bettercollected_google_test
                  MASTER_ENCRYPTION_KEYSET: ""
              run: uv run pytest --ignore=tests/unit/app/utils/test_aiohttp_client.py --ignore=tests/unit/app/views --ignore=tests/unit/app/test_asgi.py
            - name: Run google tests (mirrored to Postgres)
              env:
                  VIRTUAL_ENV: ""
                  DOTENV_PATH: /nonexistent.env
                  DB_WRITE_MODE: dual
                  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/bettercollected_test
                  AUTH_JWT_SECRET: c3c66ff889b1deabc35ebb3cf07374f1fd934f0f0185eec076b5bcd874de86d5
                  AUTH_AES_HEX_KEY: L5HuSlk0ijI3xzaccuy2x1jnzHNjtTw3zW53tjGHZG0=
                  ELASTIC_APM_DISABLE_SEND: "true"
                  MONGO_URI: mongodb://localhost:${{ job.services.mongo.ports['27017'] }}
                  MONGO_DB: bettercollected_google_test
                  MASTER_ENCRYPTION_KEYSET: ""
              run: uv run pytest --ignore=tests/unit/app/utils/test_aiohttp_client.py --ignore=tests/unit/app/views --ignore=tests/unit/app/test_asgi.py
            - name: Run google tests (served from Postgres)
              env:
                  VIRTUAL_ENV: ""
                  DOTENV_PATH: /nonexistent.env
                  DB_READ_SOURCE: postgres
                  DB_WRITE_MODE: postgres
                  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/bettercollected_test
                  AUTH_JWT_SECRET: c3c66ff889b1deabc35ebb3cf07374f1fd934f0f0185eec076b5bcd874de86d5
                  AUTH_AES_HEX_KEY: L5HuSlk0ijI3xzaccuy2x1jnzHNjtTw3zW53tjGHZG0=
                  ELASTIC_APM_DISABLE_SEND: "true"
                  MONGO_URI: mongodb://localhost:${{ job.services.mongo.ports['27017'] }}
                  MONGO_DB: bettercollected_google_test
                  MASTER_ENCRYPTION_KEYSET: ""

              run: uv run pytest --ignore=tests/unit/app/utils/test_aiohttp_client.py --ignore=tests/unit/app/views --ignore=tests/unit/app/test_asgi.py

    common-tests:
        name: Common tests (pytest)
        runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER || 'builder') || 'ubuntu-latest' }}
        # common/db is the Postgres foundation shared by the Python services
        # (plans/postgres-consolidation.md); its integration tests need a live
        # Postgres and skip themselves when DATABASE_URL is unset.
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: bettercollected_test
                ports:
                    - 5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d bettercollected_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        defaults:
            run:
                working-directory: common
        steps:
            - uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: 3.11.12
                  enable-cache: true

            - name: Install dependencies
              env:
                  VIRTUAL_ENV: ""
              run: uv sync --frozen

            - name: Run common tests
              env:
                  VIRTUAL_ENV: ""
                  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/bettercollected_test
              run: uv run pytest

    webapp-build:
        name: Webapp build & type-check
        runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER || 'builder') || 'ubuntu-latest' }}
        defaults:
            run:
                working-directory: webapp
        steps:
            - uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: yarn
                  cache-dependency-path: webapp/yarn.lock

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build (includes type-check)
              run: yarn build

    webapp-tests:
        name: Webapp tests (vitest)
        runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER || 'builder') || 'ubuntu-latest' }}
        defaults:
            run:
                working-directory: webapp
        steps:
            - uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: yarn
                  cache-dependency-path: webapp/yarn.lock

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Run tests
              run: yarn test:run

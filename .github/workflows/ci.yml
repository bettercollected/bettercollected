name: CI

# Pull requests run the Postgres persistence mode (what the service is moving
# to) and only the suites their changes can affect; the backend suite is split
# into shards that run in parallel. Every push to develop, the nightly run and a
# manual run test everything: every suite, in the Mongo, dual and Postgres modes.
# How the split works and how to refresh it: docs/ci.md.
on:
    pull_request:
        branches:
            - master
            - develop
    push:
        branches:
            - develop
    schedule:
        - cron: "23 2 * * *"
    workflow_dispatch:
        inputs:
            scope:
                description: "full: every suite in every mode; pr: what a pull request runs, for all suites"
                type: choice
                options:
                    - full
                    - pr
                default: full
            shards:
                description: "Postgres backend shards (empty: the default in .github/scripts/ci-plan.sh)"
                type: string
                default: ""

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event_name }}-${{ github.ref }}
    # a newer commit replaces a pull request's run; develop's runs all finish
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# uv compiles site-packages to bytecode once at install time, instead of every
# pytest worker compiling the modules it imports.
env:
    UV_COMPILE_BYTECODE: "1"

jobs:
    plan:
        name: Plan
        runs-on: ubuntu-latest
        outputs:
            full: ${{ steps.plan.outputs.full }}
            backend: ${{ steps.plan.outputs.backend }}
            auth: ${{ steps.plan.outputs.auth }}
            google: ${{ steps.plan.outputs.google }}
            common: ${{ steps.plan.outputs.common }}
            webapp: ${{ steps.plan.outputs.webapp }}
            modes: ${{ steps.plan.outputs.modes }}
            backend_matrix: ${{ steps.plan.outputs.backend_matrix }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # a pull request's merge commit and its base parent
                  fetch-depth: 2
                  persist-credentials: false

            - name: Decide what to run
              id: plan
              env:
                  EVENT: ${{ github.event_name }}
                  SCOPE: ${{ inputs.scope }}
                  SHARDS: ${{ inputs.shards }}
              run: .github/scripts/ci-plan.sh

    backend-tests:
        name: Backend tests (${{ matrix.mode }} ${{ matrix.group }}/${{ matrix.splits }})
        needs: plan
        if: needs.plan.outputs.backend == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.plan.outputs.backend_matrix) }}
        defaults:
            run:
                working-directory: backend
        env:
            VIRTUAL_ENV: ""
            MONGO_URI: mongodb://localhost:27017
            DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bettercollected_test
            AUTH_AES_HEX_KEY: L5HuSlk0ijI3xzaccuy2x1jnzHNjtTw3zW53tjGHZG0=
            AUTH_JWT_SECRET: c3c66ff889b1deabc35ebb3cf07374f1fd934f0f0185eec076b5bcd874de86d5
            SCHEDULAR_ENABLED: "False"
            API_ENABLE_FORM_CREATION: "True"
            UNSPLASH_ACCESS_KEY: ""
            MASTER_ENCRYPTION_KEYSET: ""
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            # Postgres always, MongoDB where the entry uses it (the Mongo and
            # dual modes, and the tests that drive Mongo themselves). The
            # Postgres shards run without it: with every group on Postgres the
            # backend must start and serve with Mongo unreachable. Both boot
            # while the dependencies install.
            - name: Start the test databases
              working-directory: .
              env:
                  MONGO: ${{ matrix.mongo }}
              run: |
                  if [ "$MONGO" = absent ]; then
                      .github/scripts/test-dbs.sh start postgres
                  else
                      .github/scripts/test-dbs.sh start postgres mongo
                  fi

            - name: Set up uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  version: "0.12.23"
                  python-version: 3.11.12
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --frozen

            # The xdist workers would otherwise each compile the same modules
            # (site-packages are compiled by uv: UV_COMPILE_BYTECODE).
            - name: Compile the sources
              run: uv run --frozen python -m compileall -q -j 0 backend tests ../common/common

            - name: Wait for the test databases
              working-directory: .
              run: .github/scripts/test-dbs.sh wait

            # Four xdist workers (a hosted runner has 4 vCPUs; more measured
            # slower), each with its own Mongo and Postgres database
            # (tests/conftest.py). pytest-split picks this shard's tests from
            # the recorded durations in .test_durations (docs/ci.md).
            # Without Mongo, MONGO_URI points at a closed port: anything that
            # tries to reach Mongo fails at once instead of finding a server.
            # MARKER "not mongo" leaves out the tests that drive Mongo
            # themselves; "mongo" runs only those (tests/conftest.py).
            - name: Run backend tests (${{ matrix.mode }} ${{ matrix.group }}/${{ matrix.splits }})
              env:
                  DB_READ_SOURCE: ${{ matrix.read_source }}
                  DB_WRITE_MODE: ${{ matrix.write_mode }}
                  SPLITS: ${{ matrix.splits }}
                  GROUP: ${{ matrix.group }}
                  IGNORE: ${{ matrix.ignore }}
                  MONGO: ${{ matrix.mongo }}
                  MARKER: ${{ matrix.marker }}
              run: |
                  extra=()
                  if [ -n "$IGNORE" ]; then extra+=("$IGNORE"); fi
                  if [ -n "$MARKER" ]; then extra+=(-m "$MARKER"); fi
                  if [ "$MONGO" = absent ]; then
                      export MONGO_URI="mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=2000"
                  fi
                  uv run --frozen pytest -n 4 --dist loadgroup \
                      --splits "$SPLITS" --group "$GROUP" --splitting-algorithm least_duration "${extra[@]}"

    auth-tests:
        name: Auth tests (${{ matrix.mode }})
        needs: plan
        if: needs.plan.outputs.auth == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                mode: ${{ fromJSON(needs.plan.outputs.modes) }}
        # The auth suite uses an in-memory Mongo mock (mongomock-motor), so no
        # Mongo is needed; Postgres serves the repository layer. In the
        # Postgres mode MONGO_URI points at a closed port: the service starts
        # without Mongo (tests/test_startup_without_mongo.py boots it so).
        defaults:
            run:
                working-directory: auth
        env:
            VIRTUAL_ENV: ""
            DOTENV_PATH: /nonexistent.env
            DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bettercollected_test
            AUTH_AES_HEX_KEY: L5HuSlk0ijI3xzaccuy2x1jnzHNjtTw3zW53tjGHZG0=
            AUTH_JWT_SECRET: c3c66ff889b1deabc35ebb3cf07374f1fd934f0f0185eec076b5bcd874de86d5
            ELASTIC_APM_DISABLE_SEND: "true"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Start the test database
              working-directory: .
              run: .github/scripts/test-dbs.sh start postgres

            - name: Set up uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  version: "0.12.23"
                  python-version: 3.11.12
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --frozen

            - name: Wait for the test database
              working-directory: .
              run: .github/scripts/test-dbs.sh wait

            - name: Run auth tests (${{ matrix.mode }})
              env:
                  MODE: ${{ matrix.mode }}
              run: |
                  case "$MODE" in
                      dual) export DB_WRITE_MODE=dual ;;
                      postgres)
                          export DB_READ_SOURCE=postgres DB_WRITE_MODE=postgres
                          export MONGO_URI="mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=2000"
                          ;;
                  esac
                  uv run --frozen pytest

    google-tests:
        name: Google integration tests (${{ matrix.mode }})
        # The google unit suite has pre-existing failures from aiohttp/pydantic API
        # drift (tests/unit/app/utils/test_aiohttp_client.py, tests/unit/app/views,
        # tests/unit/app/test_asgi.py) that predate the Postgres work and were never
        # run in CI. This job runs everything else; repairing those is a follow-up.
        needs: plan
        if: needs.plan.outputs.google == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                mode: ${{ fromJSON(needs.plan.outputs.modes) }}
        defaults:
            run:
                working-directory: integrations/google
        env:
            VIRTUAL_ENV: ""
            DOTENV_PATH: /nonexistent.env
            DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bettercollected_test
            AUTH_AES_HEX_KEY: L5HuSlk0ijI3xzaccuy2x1jnzHNjtTw3zW53tjGHZG0=
            AUTH_JWT_SECRET: c3c66ff889b1deabc35ebb3cf07374f1fd934f0f0185eec076b5bcd874de86d5
            ELASTIC_APM_DISABLE_SEND: "true"
            MONGO_URI: mongodb://localhost:27017
            MONGO_DB: bettercollected_google_test
            MASTER_ENCRYPTION_KEYSET: ""
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            # In the Postgres mode the suite runs before Mongo exists, with
            # MONGO_URI on a closed port: the service must start and serve
            # without it. Mongo then starts for the few tests that drive it
            # themselves (marker "mongo", tests/conftest.py).
            - name: Start the test databases
              working-directory: .
              env:
                  MODE: ${{ matrix.mode }}
              run: |
                  if [ "$MODE" = postgres ]; then
                      .github/scripts/test-dbs.sh start postgres
                  else
                      .github/scripts/test-dbs.sh start postgres mongo
                  fi

            - name: Set up uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  version: "0.12.23"
                  python-version: 3.11.12
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --frozen

            - name: Wait for the test databases
              working-directory: .
              run: .github/scripts/test-dbs.sh wait

            - name: Run google tests (${{ matrix.mode }})
              env:
                  MODE: ${{ matrix.mode }}
              run: |
                  extra=()
                  case "$MODE" in
                      dual) export DB_WRITE_MODE=dual ;;
                      postgres)
                          export DB_READ_SOURCE=postgres DB_WRITE_MODE=postgres
                          export MONGO_URI="mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=2000"
                          extra=(-m "not mongo")
                          ;;
                  esac
                  uv run --frozen pytest --ignore=tests/unit/app/utils/test_aiohttp_client.py --ignore=tests/unit/app/views --ignore=tests/unit/app/test_asgi.py "${extra[@]}"

            - name: Start MongoDB for the tests that drive it
              if: matrix.mode == 'postgres'
              working-directory: .
              run: |
                  .github/scripts/test-dbs.sh start mongo
                  .github/scripts/test-dbs.sh wait

            - name: Run the google tests that drive Mongo (postgres)
              if: matrix.mode == 'postgres'
              env:
                  DB_READ_SOURCE: postgres
                  DB_WRITE_MODE: postgres
              run: uv run --frozen pytest --ignore=tests/unit/app/utils/test_aiohttp_client.py --ignore=tests/unit/app/views --ignore=tests/unit/app/test_asgi.py -m mongo

    common-tests:
        name: Common tests (pytest)
        needs: plan
        if: needs.plan.outputs.common == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # common/db is the Postgres foundation shared by the Python services; its
        # integration tests need a live Postgres and skip themselves without one.
        defaults:
            run:
                working-directory: common
        env:
            VIRTUAL_ENV: ""
            DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bettercollected_test
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Start the test database
              working-directory: .
              run: .github/scripts/test-dbs.sh start postgres

            - name: Set up uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  version: "0.12.23"
                  python-version: 3.11.12
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --frozen

            - name: Wait for the test database
              working-directory: .
              run: .github/scripts/test-dbs.sh wait

            - name: Run common tests
              run: uv run --frozen pytest

    webapp-build:
        name: Webapp lint, build & type-check
        needs: plan
        if: needs.plan.outputs.webapp == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: webapp
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Node
              id: node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc

            # node_modules itself (~260 MB compressed), keyed on the lockfile and
            # the Node version: a hit skips `yarn install` entirely.
            - name: Restore node_modules
              id: modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: webapp/node_modules
                  key: webapp-node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('webapp/yarn.lock') }}

            - name: Install dependencies
              if: steps.modules.outputs.cache-hit != 'true'
              run: yarn install --frozen-lockfile

            # Results per file content; the key follows the rules (config and
            # plugin versions), so a rule change starts from an empty cache.
            - name: Restore the ESLint cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: webapp/.eslintcache
                  key: webapp-eslint-${{ hashFiles('webapp/yarn.lock', 'webapp/eslint.config.mjs') }}-${{ github.sha }}
                  restore-keys: webapp-eslint-${{ hashFiles('webapp/yarn.lock', 'webapp/eslint.config.mjs') }}-

            - name: Lint
              run: yarn lint --cache --cache-strategy content --cache-location .eslintcache

            - name: Build (includes type-check)
              run: yarn build

    webapp-tests:
        name: Webapp tests (vitest ${{ matrix.shard }}/2)
        needs: plan
        if: needs.plan.outputs.webapp == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        defaults:
            run:
                working-directory: webapp
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Node
              id: node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc

            - name: Restore node_modules
              id: modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: webapp/node_modules
                  key: webapp-node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('webapp/yarn.lock') }}

            - name: Install dependencies
              if: steps.modules.outputs.cache-hit != 'true'
              run: yarn install --frozen-lockfile

            - name: Run tests (shard ${{ matrix.shard }}/2)
              env:
                  SHARD: ${{ matrix.shard }}
              run: yarn test:run --shard="$SHARD/2"

    # One check that sums up the run: it fails when any job failed or was
    # cancelled, and passes when every job passed or was not needed (the plan
    # skips suites a pull request cannot affect). A skipped job never hides a
    # failure: jobs are skipped only by a plan that itself succeeded. Make this
    # the required check if checks become required.
    ci-ok:
        name: CI ok
        if: always()
        needs:
            - plan
            - backend-tests
            - auth-tests
            - google-tests
            - common-tests
            - webapp-build
            - webapp-tests
        runs-on: ubuntu-latest
        steps:
            - name: Every job passed or was not needed
              env:
                  RESULTS: ${{ toJSON(needs) }}
              run: |
                  echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
                  echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
                  echo "$RESULTS" | jq -e '.plan.result == "success"' >/dev/null

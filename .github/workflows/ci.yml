name: CI

on:
    pull_request:
        branches:
            - master
            - develop

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend-tests:
        name: Backend tests (pytest)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4

            - name: Set up uv
              uses: astral-sh/setup-uv@v5
              with:
                  python-version: 3.11.12
                  enable-cache: true

            - name: Install dependencies
              env:
                  VIRTUAL_ENV: ""
              run: uv sync --frozen

            - name: Run backend tests
              env:
                  VIRTUAL_ENV: ""
                  AUTH_AES_HEX_KEY: L5HuSlk0ijI3xzaccuy2x1jnzHNjtTw3zW53tjGHZG0=
                  AUTH_JWT_SECRET: c3c66ff889b1deabc35ebb3cf07374f1fd934f0f0185eec076b5bcd874de86d5
                  SCHEDULAR_ENABLED: "False"
                  API_ENABLE_FORM_CREATION: "True"
                  UNSPLASH_ACCESS_KEY: ""
                  MASTER_ENCRYPTION_KEYSET: ""
              run: uv run pytest

    webapp-build:
        name: Webapp build & type-check
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: webapp
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn
                  cache-dependency-path: webapp/yarn.lock

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build (includes type-check)
              run: yarn build

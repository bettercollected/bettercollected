name: Build and Deploy

permissions:
    contents: read
    id-token: write

on:
    push:
        branches:
            - develop
            - master
        tags:
            - "*"

jobs:
    build-and-push:
        strategy:
            matrix:
                service:
                    - auth
                    - backend
                    - integrations/google
                    - webapp
                    - temporal/worker
                    - temporal/actions-executor
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code with submodules
              uses: actions/checkout@v7

            - name: Set up Docker
              uses: docker/login-action@v4
              with:
                  registry: docker.io
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Build and Push Docker image
              id: docker_build
              env:
                  SERVICE_TAG: ${{ matrix.service }}
              run: |
                  SERVICE_TAG=${SERVICE_TAG//\//-}
                  if [[ "${{ github.ref }}" = "refs/heads/develop" ]]; then
                    API_ENDPOINT_HOST=${{ vars.DEVELOP_API }}
                  fi
                  if [[ "${{ github.ref }}" = "refs/heads/master" ]]; then
                    API_ENDPOINT_HOST=${{ vars.STAGING_API }}
                  fi
                  if [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
                    API_ENDPOINT_HOST=${{ vars.PROD_API }}
                  fi
                  docker build \
                    --build-arg NEXT_PUBLIC_API_ENDPOINT_HOST=${API_ENDPOINT_HOST} \
                    -f ${{ matrix.service }}/Dockerfile \
                    -t bettercollected/${SERVICE_TAG}:${{ github.sha }} .
                  docker push bettercollected/${SERVICE_TAG}:${{ github.sha }}

            - name: Add Nightly, Latest and Release Tags
              env:
                  SERVICE_TAG: ${{ matrix.service }}
              run: |
                  SERVICE_TAG=${SERVICE_TAG//\//-}
                  if [[ "${{ github.ref }}" = "refs/heads/develop" ]]; then
                    docker tag bettercollected/${SERVICE_TAG}:${{ github.sha }} bettercollected/${SERVICE_TAG}:nightly
                    docker push bettercollected/${SERVICE_TAG}:nightly
                  fi
                  if [[ "${{ github.ref }}" = "refs/heads/master" ]]; then
                    docker tag bettercollected/${SERVICE_TAG}:${{ github.sha }} bettercollected/${SERVICE_TAG}:latest
                    docker push bettercollected/${SERVICE_TAG}:latest
                  fi
                  if [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
                    docker tag bettercollected/${SERVICE_TAG}:${{ github.sha }} bettercollected/${SERVICE_TAG}:release
                    docker tag bettercollected/${SERVICE_TAG}:${{ github.sha }} bettercollected/${SERVICE_TAG}:${{ github.ref_name }}
                    docker push bettercollected/${SERVICE_TAG}:release
                    docker push bettercollected/${SERVICE_TAG}:${{ github.ref_name }}
                  fi

    deploy:
        needs: build-and-push
        strategy:
            # One service failing to converge must not cancel the others'
            # deploys — each service updates independently.
            fail-fast: false
            matrix:
                service:
                    - auth
                    - backend
                    - integrations/google
                    - webapp
                    - temporal/worker
                    - temporal/actions-executor
        runs-on: builder
        steps:
            - name: Select deployment target
              id: target
              env:
                  DEVELOP_MANAGER: ${{ vars.DEVELOP_MANAGER }}
                  STAGING_MANAGER: ${{ vars.STAGING_MANAGER }}
                  PROD_MANAGER: ${{ vars.PROD_MANAGER }}
              run: |
                  SERVICE_TAG=$(echo "${{ matrix.service }}" | tr '/' '-')

                  if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
                    ENVIRONMENT="development"
                    DOCKER_STACK="${{ vars.DEVELOP_STACK }}"
                    DOCKER_MANAGER="${DEVELOP_MANAGER}"
                    IMAGE="bettercollected/${SERVICE_TAG}:${{ github.sha }}"

                  elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
                    ENVIRONMENT="staging"
                    DOCKER_STACK="${{ vars.STAGING_STACK }}"
                    DOCKER_MANAGER="${STAGING_MANAGER}"
                    IMAGE="bettercollected/${SERVICE_TAG}:${{ github.sha }}"

                  elif [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
                    ENVIRONMENT="production"
                    DOCKER_STACK="${{ vars.PROD_STACK }}"
                    DOCKER_MANAGER="${PROD_MANAGER}"
                    IMAGE="bettercollected/${SERVICE_TAG}:${{ github.ref_name }}"

                  else
                    echo "Unexpected deployment ref: ${{ github.ref }}" >&2
                    exit 1
                  fi

                  if [[ -z "${DOCKER_MANAGER}" ]]; then
                    echo "${ENVIRONMENT} deployment requires its manager variable to be set" >&2
                    exit 1
                  fi

                  if [[ -z "${DOCKER_STACK}" ]]; then
                    echo "${ENVIRONMENT} deployment requires its stack variable to be set" >&2
                    exit 1
                  fi

                  echo "Deploying ${SERVICE_TAG} to ${ENVIRONMENT} stack ${DOCKER_STACK} using its configured Docker Manager"
                  {
                    echo "manager=${DOCKER_MANAGER}"
                    echo "stack=${DOCKER_STACK}"
                    echo "image=${IMAGE}"
                    echo "service=${SERVICE_TAG}"
                  } >> "$GITHUB_OUTPUT"

            - name: Deploy / update service through Docker Manager
              uses: mesudip/docker-stack@v2
              with:
                  manager: ${{ steps.target.outputs.manager }}
                  stack: ${{ steps.target.outputs.stack }}
                  images: ${{ steps.target.outputs.service }}=${{ steps.target.outputs.image }}
                  with-registry-auth: "true"

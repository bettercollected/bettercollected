name: Build and Deploy

permissions:
    contents: read
    id-token: write

on:
    push:
        branches:
            - develop
            - master
        # release tags only (vMAJOR.MINOR.PATCH, optionally with a pre-release
        # suffix); the jobs below check the name again before using it
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
            - "v[0-9]+.[0-9]+.[0-9]+-*"

jobs:
    build-and-push:
        strategy:
            matrix:
                service:
                    - auth
                    - backend
                    - integrations/google
                    - webapp
                    - temporal/worker
                    - temporal/actions-executor
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code with submodules
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Docker
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: docker.io
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            # Context values reach the shell through env, never by interpolation into
            # the script, and every expansion is quoted.
            - name: Build and Push Docker image
              id: docker_build
              env:
                  SERVICE_TAG: ${{ matrix.service }}
                  SERVICE_DIR: ${{ matrix.service }}
                  GIT_REF: ${{ github.ref }}
                  GIT_SHA: ${{ github.sha }}
                  REF_NAME: ${{ github.ref_name }}
                  DEVELOP_API: ${{ vars.DEVELOP_API }}
                  STAGING_API: ${{ vars.STAGING_API }}
                  PROD_API: ${{ vars.PROD_API }}
              run: |
                  set -euo pipefail
                  SERVICE_TAG="${SERVICE_TAG//\//-}"
                  if [[ ! "${GIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "Unexpected commit id" >&2
                    exit 1
                  fi
                  # The version the dashboard sidebar shows: the release tag on a
                  # tag build, else the stack and the short commit.
                  API_ENDPOINT_HOST=""
                  APP_VERSION=""
                  if [[ "${GIT_REF}" = "refs/heads/develop" ]]; then
                    API_ENDPOINT_HOST="${DEVELOP_API}"
                    APP_VERSION="dev-${GIT_SHA:0:7}"
                  fi
                  if [[ "${GIT_REF}" = "refs/heads/master" ]]; then
                    API_ENDPOINT_HOST="${STAGING_API}"
                    APP_VERSION="staging-${GIT_SHA:0:7}"
                  fi
                  if [[ "${GIT_REF}" =~ ^refs/tags/ ]]; then
                    if [[ ! "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "Refusing to build a release from the tag name: not a version tag" >&2
                      exit 1
                    fi
                    API_ENDPOINT_HOST="${PROD_API}"
                    APP_VERSION="${REF_NAME}"
                  fi
                  docker build \
                    --build-arg "NEXT_PUBLIC_API_ENDPOINT_HOST=${API_ENDPOINT_HOST}" \
                    --build-arg "NEXT_PUBLIC_APP_VERSION=${APP_VERSION}" \
                    -f "${SERVICE_DIR}/Dockerfile" \
                    -t "bettercollected/${SERVICE_TAG}:${GIT_SHA}" .
                  docker push "bettercollected/${SERVICE_TAG}:${GIT_SHA}"

            - name: Add Nightly, Latest and Release Tags
              env:
                  SERVICE_TAG: ${{ matrix.service }}
                  GIT_REF: ${{ github.ref }}
                  GIT_SHA: ${{ github.sha }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  SERVICE_TAG="${SERVICE_TAG//\//-}"
                  if [[ "${GIT_REF}" = "refs/heads/develop" ]]; then
                    docker tag "bettercollected/${SERVICE_TAG}:${GIT_SHA}" "bettercollected/${SERVICE_TAG}:nightly"
                    docker push "bettercollected/${SERVICE_TAG}:nightly"
                  fi
                  if [[ "${GIT_REF}" = "refs/heads/master" ]]; then
                    docker tag "bettercollected/${SERVICE_TAG}:${GIT_SHA}" "bettercollected/${SERVICE_TAG}:latest"
                    docker push "bettercollected/${SERVICE_TAG}:latest"
                  fi
                  if [[ "${GIT_REF}" =~ ^refs/tags/ ]]; then
                    if [[ ! "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "Refusing to tag a release from the tag name: not a version tag" >&2
                      exit 1
                    fi
                    docker tag "bettercollected/${SERVICE_TAG}:${GIT_SHA}" "bettercollected/${SERVICE_TAG}:release"
                    docker tag "bettercollected/${SERVICE_TAG}:${GIT_SHA}" "bettercollected/${SERVICE_TAG}:${REF_NAME}"
                    docker push "bettercollected/${SERVICE_TAG}:release"
                    docker push "bettercollected/${SERVICE_TAG}:${REF_NAME}"
                  fi

    deploy:
        needs: build-and-push
        runs-on: builder
        # One stack update at a time per branch or tag: a deploy that starts
        # while the previous one for the same ref is still running waits for
        # it instead of hitting the Docker Manager at the same time. Only the
        # deploy job queues, so images keep building in parallel. Each tag is
        # its own ref, so a release never waits for, or is replaced by, a
        # develop or master deploy. While one deploy runs, GitHub keeps only
        # the newest waiting one for that ref, so a burst of merges deploys
        # the latest commit and skips the ones in between; nothing that has
        # started is ever cancelled.
        concurrency:
            group: deploy-${{ github.ref }}
            cancel-in-progress: false
        steps:
            - name: Select deployment target
              id: target
              env:
                  GIT_REF: ${{ github.ref }}
                  GIT_SHA: ${{ github.sha }}
                  REF_NAME: ${{ github.ref_name }}
                  DEVELOP_STACK: ${{ vars.DEVELOP_STACK }}
                  STAGING_STACK: ${{ vars.STAGING_STACK }}
                  PROD_STACK: ${{ vars.PROD_STACK }}
                  DEVELOP_MANAGER: ${{ vars.DEVELOP_MANAGER }}
                  STAGING_MANAGER: ${{ vars.STAGING_MANAGER }}
                  PROD_MANAGER: ${{ vars.PROD_MANAGER }}
                  DEVELOP_BACKEND_IMAGE_SERVICES: ${{ vars.DEVELOP_BACKEND_IMAGE_SERVICES }}
                  STAGING_BACKEND_IMAGE_SERVICES: ${{ vars.STAGING_BACKEND_IMAGE_SERVICES }}
                  PROD_BACKEND_IMAGE_SERVICES: ${{ vars.PROD_BACKEND_IMAGE_SERVICES }}
              run: |
                  set -euo pipefail
                  if [[ "${GIT_REF}" == "refs/heads/develop" ]]; then
                    ENVIRONMENT="development"
                    DOCKER_STACK="${DEVELOP_STACK}"
                    DOCKER_MANAGER="${DEVELOP_MANAGER}"
                    BACKEND_IMAGE_SERVICES="${DEVELOP_BACKEND_IMAGE_SERVICES}"
                    IMAGE_TAG="${GIT_SHA}"

                  elif [[ "${GIT_REF}" == "refs/heads/master" ]]; then
                    ENVIRONMENT="staging"
                    DOCKER_STACK="${STAGING_STACK}"
                    DOCKER_MANAGER="${STAGING_MANAGER}"
                    BACKEND_IMAGE_SERVICES="${STAGING_BACKEND_IMAGE_SERVICES}"
                    IMAGE_TAG="${GIT_SHA}"

                  elif [[ "${GIT_REF}" == "refs/tags/"* ]]; then
                    # only a version tag deploys to production
                    if [[ ! "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "Refusing a production deployment from a tag that is not a version tag" >&2
                      exit 1
                    fi
                    ENVIRONMENT="production"
                    DOCKER_STACK="${PROD_STACK}"
                    DOCKER_MANAGER="${PROD_MANAGER}"
                    BACKEND_IMAGE_SERVICES="${PROD_BACKEND_IMAGE_SERVICES}"
                    IMAGE_TAG="${REF_NAME}"

                  else
                    echo "Unexpected deployment ref" >&2
                    exit 1
                  fi

                  if [[ -z "${DOCKER_MANAGER}" ]]; then
                    echo "${ENVIRONMENT} deployment requires its manager variable to be set" >&2
                    exit 1
                  fi

                  if [[ -z "${DOCKER_STACK}" ]]; then
                    echo "${ENVIRONMENT} deployment requires its stack variable to be set" >&2
                    exit 1
                  fi

                  # Stack services that run the backend image under their own name
                  # (admin, jobs-worker, ...). Only the ones this target's stack runs
                  # are listed in its variable: never send a service the stack lacks.
                  read -r -d '' -a BACKEND_IMAGE_SERVICE_NAMES <<< "${BACKEND_IMAGE_SERVICES}" || true
                  for SERVICE in "${BACKEND_IMAGE_SERVICE_NAMES[@]}"; do
                    if [[ ! "${SERVICE}" =~ ^[a-z0-9-]+$ ]]; then
                      echo "${ENVIRONMENT} backend image services: names may only use a-z, 0-9 and -" >&2
                      exit 1
                    fi
                    case " auth backend integrations-google webapp temporal-worker temporal-actions-executor " in
                      *" ${SERVICE} "*)
                        echo "${ENVIRONMENT} backend image services: ${SERVICE} is deployed with its own image" >&2
                        exit 1
                        ;;
                    esac
                  done

                  echo "Deploying all service images to ${ENVIRONMENT} stack ${DOCKER_STACK} using its configured Docker Manager"
                  echo "Backend image also deployed as: ${BACKEND_IMAGE_SERVICE_NAMES[*]:-none}"
                  {
                    echo "manager=${DOCKER_MANAGER}"
                    echo "stack=${DOCKER_STACK}"
                    echo "images<<EOF"
                    for SERVICE in auth backend integrations/google webapp temporal/worker temporal/actions-executor; do
                      SERVICE_TAG="${SERVICE//\//-}"
                      echo "${SERVICE_TAG}=bettercollected/${SERVICE_TAG}:${IMAGE_TAG}"
                    done
                    for SERVICE in "${BACKEND_IMAGE_SERVICE_NAMES[@]}"; do
                      echo "${SERVICE}=bettercollected/backend:${IMAGE_TAG}"
                    done
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Deploy / update services through Docker Manager
              uses: mesudip/docker-stack@c3af89a3e028e9080eea773a4a5fdcec6f77134d # v2
              with:
                  manager: ${{ steps.target.outputs.manager }}
                  stack: ${{ steps.target.outputs.stack }}
                  images: ${{ steps.target.outputs.images }}
                  with-registry-auth: "true"

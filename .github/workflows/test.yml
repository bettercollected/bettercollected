name: Run Tests

on:
    push:
        branches:
            - tests

permissions:
    contents: read

jobs:
    backend-test:
        runs-on: ubuntu-latest
        services:
            mongo:
                image: mongo:7
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: bettercollected_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d bettercollected_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout code with submodules
              uses: actions/checkout@v7
              with:
                  submodules: "recursive"

            - name: Set up uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: 3.11.12
                  enable-cache: true

            - name: Install dependencies
              env:
                  VIRTUAL_ENV: ""
              run: uv sync --frozen

            - name: Run test cases on backend
              id: test-backend
              env:
                  VIRTUAL_ENV: ""
                  MONGO_URI: mongodb://localhost:27017
                  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bettercollected_test
                  AUTH_AES_HEX_KEY: L5HuSlk0ijI3xzaccuy2x1jnzHNjtTw3zW53tjGHZG0=
                  AUTH_JWT_SECRET: c3c66ff889b1deabc35ebb3cf07374f1fd934f0f0185eec076b5bcd874de86d5
                  SCHEDULAR_ENABLED: "False"
                  API_ENABLE_FORM_CREATION: "True"
                  UNSPLASH_ACCESS_KEY: ""
                  MASTER_ENCRYPTION_KEYSET: ""
              run: uv run pytest

    schemathesis:
        runs-on: ubuntu-latest
        steps:
            - name: Configure schemathesis using action
              uses: schemathesis/action@v1
              with:
                  schema: "https://bettercollected-admin.sireto.dev/api/v1/openapi.json"
                  max-examples: 30
                  version: "latest"
                  report: false

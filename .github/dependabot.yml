version: 2
updates:
  # Frontend (Yarn)
  - package-ecosystem: "npm"
    directory: "/webapp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      webapp-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "webapp"]
    ignore:
      # Types follow the Node runtime major (webapp/Dockerfile, .nvmrc);
      # bump them together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 is a config migration (CSS-first config, new PostCSS
      # plugin, renamed utilities); it is planned separately.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-scrollbar"
        update-types: ["version-update:semver-major"]

  # Python services (uv)
  - package-ecosystem: "uv"
    directories:
      - "/backend"
      - "/auth"
      - "/common"
      - "/integrations/google"
      - "/temporal/worker"
      - "/temporal/actions-executor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]
    ignore:
      # mcp 2.x renames FastMCP to MCPServer and changes the server APIs
      # (backend/backend/app/mcp/server.py). Backend pins mcp<2; the v2
      # migration is planned separately. Minor and patch updates still flow.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]

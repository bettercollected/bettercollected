version: 2
updates:
  # Frontend (Yarn)
  - package-ecosystem: "npm"
    directory: "/webapp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      webapp-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "webapp"]
    ignore:
      # Types follow the Node runtime major (webapp/Dockerfile, .nvmrc);
      # bump them together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Python services (uv)
  - package-ecosystem: "uv"
    directories:
      - "/backend"
      - "/auth"
      - "/common"
      - "/integrations/google"
      - "/temporal/worker"
      - "/temporal/actions-executor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]

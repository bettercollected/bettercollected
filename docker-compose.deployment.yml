version: '3.7'
volumes:
  doc-sandbox:
  settings-snapshots-backend:
  settings-snapshots-auth:
  settings-snapshots-google:
  mongo-data:
  app-postgres-data:
  umami-db-data:
  temporal-postgres-data:
networks:
  # Carries the admin service's published port, and nothing else, so the peer
  # address it sees for host traffic is this network's gateway.
  admin-edge:
    ipam:
      config:
        - subnet: ${ADMIN_EDGE_SUBNET:-172.30.77.0/29}
          gateway: ${ADMIN_EDGE_GATEWAY:-172.30.77.1}
  # Private path between the admin service and app-postgres. internal: no
  # gateway, no published ports, no route out; only those two attach.
  admin-db:
    internal: true
services:
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo-data:/data/db
    restart: always
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-seed:
    build:
      context: .
      dockerfile: Dockerfile.deployment.mongo-seed
    environment:
      GOOGLE_ENABLED: ${GOOGLE_ENABLED}
      TYPEFORM_ENABLED: ${TYPEFORM_ENABLED}
    depends_on:
      mongodb:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: on-failure




  # If you want to run webapp locally without using docker-compose,
  # you will also need to run nginx locally and not from docker-compose
  webapp:
    image: bettercollected/webapp:nightly
    # image: bettercollected/webapp:nightly
    environment:
      INTERNAL_DOCKER_API_ENDPOINT_HOST: http://backend:8000/api/v1
      API_ENDPOINT_HOST: http://localhost:8000/api/v1
      ADMIN_DOMAIN: localhost:3000
      CLIENT_DOMAIN: localhost:3001
      NEXT_PUBLIC_NODE_ENV: development
      # Single sign-on UI (docs/sso.md), read at runtime; the same root .env
      # switch as the backend and auth
      SSO_ENABLED: ${SSO_ENABLED:-false}
    env_file:
      - .env.deployment
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
      auth:
        condition: service_healthy

  postgresql:
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    # Pinned (not `postgres:latest`): an unpinned tag silently moves to new
    # major versions, which refuse to start against an old major version's
    # on-disk format (hit this directly while testing — `latest` had already
    # drifted to Postgres 18, which won't read older data at all). Matches
    # umami-postgresql's major version below for consistency.
    image: postgres:15-alpine
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 5s
      retries: 10
  temporal:
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      # NOT "postgresql" — temporalio/auto-setup only recognizes mysql8,
      # postgres12, postgres12_pgx, cassandra as DB drivers. The old value
      # silently failed at startup ("Unsupported driver specified") with no
      # healthcheck to surface it; caught this via the healthcheck added below.
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      # Without this, auto-setup binds to the container's dynamic bridge IP
      # (logged as "TEMPORAL_ADDRESS is not set, setting it to <ip>:7233"),
      # which isn't reachable via localhost from inside the same container —
      # breaks any localhost-based healthcheck/CLI use. Pin it to the compose
      # service name, which is also what worker/backend already use to reach it.
      - TEMPORAL_ADDRESS=temporal:7233
    image: temporalio/auto-setup
    ports:
      - "7234:7233"
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', 'temporal:7233']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Application database — the consolidation target for MongoDB and Temporal
  # (plans/postgres-consolidation.md). One schema per service (app / auth /
  # google / jobs), one least-privilege role each, created on the volume's first
  # start by postgres/init/01-roles-schemas.sh from the passwords below.
  # `deploy.sh` generates APP_POSTGRES_PASSWORD and the BC_*_PASSWORD values into
  # the root `.env` on first run (compose's var-substitution file, exactly like
  # UMAMI_APP_SECRET). Running the compose file directly? Set them yourself —
  # the `:?` markers make compose refuse to start with them missing rather than
  # bring up a database with empty passwords. Major version pinned for the same
  # reason as the Temporal postgres above.
  app-postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: bettercollected
      POSTGRES_USER: bettercollected
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?set by deploy.sh in the root .env}
      BC_APP_PASSWORD: ${BC_APP_PASSWORD:?set by deploy.sh in the root .env}
      BC_AUTH_PASSWORD: ${BC_AUTH_PASSWORD:?set by deploy.sh in the root .env}
      BC_GOOGLE_PASSWORD: ${BC_GOOGLE_PASSWORD:?set by deploy.sh in the root .env}
      BC_JOBS_EXEC_PASSWORD: ${BC_JOBS_EXEC_PASSWORD:?set by deploy.sh in the root .env}
      # read by postgres/ensure-admin-roles.sh, which deploy.sh runs here on every deploy
      BC_ADMIN_PASSWORD: ${BC_ADMIN_PASSWORD:?set by deploy.sh in the root .env}
      BC_ADMIN_MIG_PASSWORD: ${BC_ADMIN_MIG_PASSWORD:?set by deploy.sh in the root .env}
      BC_TASKS_PASSWORD: ${BC_TASKS_PASSWORD:?set by deploy.sh in the root .env}
    # explicit priorities: without them Compose 2.24 / Engine 27 sometimes left
    # this container on one network only (docs/admin-service.md)
    networks:
      default:
        priority: 100
      admin-db:
        priority: 50
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bettercollected -d bettercollected']
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    image: bettercollected/temporal-worker:nightly
    environment:
      TEMPORAL_SERVER_URL: temporal:7233
      # the backend's TEMPORAL_API_KEY: its internal job routes require it
      API_KEY: ${TEMPORAL_API_KEY:?set by deploy.sh in the root .env}
      # the stack's AUTH_AES_HEX_KEY (a Fernet key): preview tokens
      AES_HEX_KEY: ${AUTH_AES_HEX_KEY:?set by deploy.sh in the root .env}

    env_file:
      - .env.deployment
    depends_on:
      temporal:
        condition: service_healthy
  # You need to run nginx only if your webapp is running locally without using docker-compose
  # You may need to setup nginx locally with same configs provided inside `./nginx.conf`
  nginx:
    image: nginx
    volumes:
      - ./nginx-deployment.conf:/etc/nginx/conf.d/nginx-deployment.conf:ro
    ports:
      - '3001:3001'
      - '3002:3002'


  backend:
    image: bettercollected/backend:nightly
    # image: bettercollected/backend:nightly
    environment:
      # the signed settings snapshot (a rollback floor and a DB-down fallback) must
      # survive container recreation: keep it on a named volume
      SETTINGS_SNAPSHOT_DIR: /var/lib/bc-settings
      # the internal API serves no /docs, /redoc or /openapi.json unless true
      API_DOCS_ENABLED: "false"
      # debug mode answers unhandled errors with an HTML traceback; keep it off
      DEBUG: "false"
      AUTH_BASE_URL: http://auth:8000/api/v1
      AUTH_CALLBACK_URI: http://auth:8000/api/v1/auth/callback
      # Backend reaches Umami over the compose network; only UMAMI_USERNAME/
      # UMAMI_PASSWORD/UMAMI_WEBSITE_ID need to come from .env.deployment.
      UMAMI_URL: http://umami:3000
      DATABASE_URL: postgresql+asyncpg://bc_app:${BC_APP_PASSWORD}@app-postgres:5432/bettercollected
      # shared with auth and integrations-googleform: the auth service's API
      # refuses every request without it (sign-in, users, billing, mails)
      AUTH_INTERNAL_NOTIFY_KEY: ${AUTH_INTERNAL_NOTIFY_KEY:?set by deploy.sh in the root .env}
      # shared with worker (and the actions-executor, as API_KEY): the internal
      # job routes (imports, deletions, actions) answer 503 without it
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:?set by deploy.sh in the root .env}
      # this stack's own signing and encryption keys, generated by deploy.sh
      # into the root .env (deploy/generate-secrets.sh); the services refuse
      # to start without them or with a value published in the repository
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set by deploy.sh in the root .env}
      AUTH_AES_HEX_KEY: ${AUTH_AES_HEX_KEY:?set by deploy.sh in the root .env}
      MASTER_ENCRYPTION_KEYSET: ${MASTER_ENCRYPTION_KEYSET:?set by deploy.sh in the root .env}
      # Schema migrations: deploy.sh runs them before the services roll. A stack
      # deployed without it (Docker Swarm / docker stack deploy, CI) can let each
      # service migrate its own schema at startup instead — replicas serialise on
      # a Postgres advisory lock — by setting, here or in .env.deployment:
      # DB_AUTO_MIGRATE: "true"
      # PDF form import: documents are only opened by the isolated document-sandbox
      # Client addresses: the TCP peer is the client unless it is listed here.
      # Set TRUSTED_PROXIES in the root .env to the address(es)/CIDR(s) your
      # reverse proxy or load balancer connects from (comma-separated, IPv4
      # and IPv6) so its X-Forwarded-For / CF-Connecting-IP are believed;
      # left empty, every client looks like the proxy. API_TRUSTED_PROXIES
      # is read too, from the root .env.
      API_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-${API_TRUSTED_PROXIES:-}}
      PDF_IMPORT_SANDBOX_SOCKET: /run/doc-sandbox/sandbox.sock
      PDF_IMPORT_REQUIRE_ISOLATED_SANDBOX: "true"
      # Single sign-on (docs/sso.md): off unless SSO_ENABLED=true in the root
      # .env; deploy.sh then adds docker-compose.sso-deployment.yml (Polis and
      # its networks). All SSO_* values come from the root .env.
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_POLIS_URL: ${SSO_POLIS_URL:-}
      SSO_POLIS_INTERNAL_URL: http://polis:5225
      SSO_POLIS_API_KEY: ${SSO_POLIS_API_KEY:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
      SSO_SAML_AUDIENCE: ${SSO_SAML_AUDIENCE:-}
    env_file:
      - .env.deployment
    volumes:
      - settings-snapshots-backend:/var/lib/bc-settings
      - doc-sandbox:/run/doc-sandbox
    ports:
      - '8000:8000'
    depends_on:
      temporal:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      umami:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1/public/v1/openapi.json']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Internal admin service (docs/admin-service.md). Published on the host's
  # loopback only and never routed by nginx; reach it with `ssh -L`.
  # Networks: `admin-edge` (pinned, only this service) carries the published
  # port, so Docker's NAT shows the service a known gateway address that
  # ADMIN_ALLOWED_IPS admits; `admin-db` (internal) is its private path to
  # app-postgres. It is NOT on `default`, so no sibling container can reach it.
  # No env_file: only the variables below. The portal starts only when
  # ADMIN_DATABASE_URL, SETTINGS_MASTER_KEY and PLATFORM_ADMIN_EMAILS are all
  # non-empty; otherwise the service runs as the bare gate (health check and
  # 404s). The three default to empty so `docker compose config` and older
  # deployments keep working; deploy.sh generates the first two, and
  # PLATFORM_ADMIN_EMAILS (the super admin list) is set by the operator.
  admin:
    image: bettercollected/backend:nightly
    command: ["/api/backend/.venv/bin/python", "-m", "backend.admin.serve"]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    environment:
      ADMIN_BIND_HOST: 0.0.0.0
      ADMIN_LISTEN_PORT: "8000"
      ADMIN_PORT: ${ADMIN_PORT:-8100}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-127.0.0.1/32}
      ADMIN_ALLOWED_HOSTS: ${ADMIN_ALLOWED_HOSTS:-localhost:${ADMIN_PORT:-8100},127.0.0.1:${ADMIN_PORT:-8100}}
      ADMIN_PUBLIC_ORIGINS: ${ADMIN_PUBLIC_ORIGINS:-http://localhost:${ADMIN_PORT:-8100},http://127.0.0.1:${ADMIN_PORT:-8100}}
      ADMIN_TRUSTED_PROXIES: ${ADMIN_TRUSTED_PROXIES:-}
      ADMIN_EDGE_GATEWAY: ${ADMIN_EDGE_GATEWAY:-172.30.77.1}
      # the bc_admin role sees only schema `admin` (postgres/ensure-admin-roles.sh);
      # empty without the password, which keeps the service in bare-gate mode
      ADMIN_DATABASE_URL: ${BC_ADMIN_PASSWORD:+postgresql+asyncpg://bc_admin:${BC_ADMIN_PASSWORD}@app-postgres:5432/bettercollected}
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      # sign-in codes and notices go out through the same SMTP settings as the
      # other services (root .env)
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_SERVER: ${MAIL_SMTP_SERVER:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SENDER: ${MAIL_SENDER:-}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-}
      MAIL_SSL_TLS: ${MAIL_SSL_TLS:-}
      MAIL_USE_CREDENTIALS: ${MAIL_USE_CREDENTIALS:-}
      MAIL_VALIDATE_CERTS: ${MAIL_VALIDATE_CERTS:-}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8100}:8000"
    networks:
      admin-edge:
        priority: 100
      admin-db:
        priority: 50
    depends_on:
      app-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api/backend/.venv/bin/python", "-I", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read() == b'ok' else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # The data task runner for the internal admin service: claims signed task
  # requests from the tasks schema and runs them. Not started by deploy.sh yet
  # (like `admin`); start it with `docker compose up -d task-runner`. Isolated on
  # purpose: no published port, no env_file, only the two variables it needs, its
  # own database role (bc_tasks), read-only filesystem, no capabilities, and not
  # attached to admin-edge. Task implementations that need Mongo or other
  # services add exactly the variables they need here.
  task-runner:
    image: bettercollected/backend:nightly
    command: ["/api/backend/.venv/bin/python", "-m", "backend.admin.runner"]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    environment:
      TASKS_DATABASE_URL: postgresql+asyncpg://bc_tasks:${BC_TASKS_PASSWORD:?set by deploy.sh in the root .env}@app-postgres:5432/bettercollected
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY:?set by deploy.sh in the root .env}
    depends_on:
      app-postgres:
        condition: service_healthy
    restart: unless-stopped

  # Opens uploaded PDF forms for the import (#698, #703). Isolated on purpose:
  # unprivileged user, no network, read-only filesystem, no capabilities, a
  # seccomp syscall allowlist and no environment file (it holds no secrets). The backend and the jobs worker reach
  # it over a Unix socket on the doc-sandbox volume.
  document-sandbox:
    image: bettercollected/backend:nightly
    command: ["/api/backend/.venv/bin/python", "-I", "/api/backend/backend/app/services/pdf_import/server.py", "/run/doc-sandbox/sandbox.sock"]
    user: "65534:65534"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # only the syscalls parsing and rendering need, no network sockets
      # (deploy/seccomp/README.md); path relative to the repository root
      - seccomp=./deploy/seccomp/document-sandbox.json
    pids_limit: 64
    # DOC_SANDBOX_PARALLEL x PDF_IMPORT_SANDBOX_MEMORY_MB (1536) + 512m for the server
    mem_limit: 3584m
    cpus: 2
    environment:
      DOC_SANDBOX_PARALLEL: "2"
    volumes:
      - doc-sandbox:/run/doc-sandbox
    healthcheck:
      test: ["CMD", "/api/backend/.venv/bin/python", "-I", "-c", "import socket; s = socket.socket(socket.AF_UNIX); s.connect('/run/doc-sandbox/sandbox.sock')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Consumes the procrastinate `default` queue (delete_user, delete_response) when
  # JOBS_BACKEND routes those to Postgres; same image and env as the backend.
  jobs-worker:
    image: bettercollected/backend:nightly
    command: ["/api/backend/.venv/bin/python", "-m", "backend.jobs.worker"]
    environment:
      AUTH_BASE_URL: http://auth:8000/api/v1
      AUTH_CALLBACK_URI: http://auth:8000/api/v1/auth/callback
      # Backend reaches Umami over the compose network; only UMAMI_USERNAME/
      # UMAMI_PASSWORD/UMAMI_WEBSITE_ID need to come from .env.deployment.
      UMAMI_URL: http://umami:3000
      DATABASE_URL: postgresql+asyncpg://bc_app:${BC_APP_PASSWORD}@app-postgres:5432/bettercollected
      # delete_user removes the account from the auth service (see backend)
      AUTH_INTERNAL_NOTIFY_KEY: ${AUTH_INTERNAL_NOTIFY_KEY:?set by deploy.sh in the root .env}
      # this stack's own signing and encryption keys, generated by deploy.sh
      # into the root .env (deploy/generate-secrets.sh); the services refuse
      # to start without them or with a value published in the repository
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set by deploy.sh in the root .env}
      AUTH_AES_HEX_KEY: ${AUTH_AES_HEX_KEY:?set by deploy.sh in the root .env}
      MASTER_ENCRYPTION_KEYSET: ${MASTER_ENCRYPTION_KEYSET:?set by deploy.sh in the root .env}
      # PDF form import: documents are only opened by the isolated document-sandbox
      PDF_IMPORT_SANDBOX_SOCKET: /run/doc-sandbox/sandbox.sock
      PDF_IMPORT_REQUIRE_ISOLATED_SANDBOX: "true"
      # deleting a user's workspaces also deletes their SSO connections in Polis
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_POLIS_URL: ${SSO_POLIS_URL:-}
      SSO_POLIS_INTERNAL_URL: http://polis:5225
      SSO_POLIS_API_KEY: ${SSO_POLIS_API_KEY:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
    env_file:
      - .env.deployment
    volumes:
      - doc-sandbox:/run/doc-sandbox
    depends_on:
      app-postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  auth:
    image: bettercollected/auth:nightly
    # image: bettercollected/auth:nightly
    environment:
      # the signed settings snapshot (a rollback floor and a DB-down fallback) must
      # survive container recreation: keep it on a named volume
      SETTINGS_SNAPSHOT_DIR: /var/lib/bc-settings
      # the internal API serves no /docs, /redoc or /openapi.json unless true
      API_DOCS_ENABLED: "false"
      # debug mode answers unhandled errors with an HTML traceback; keep it off
      DEBUG: "false"
      TYPEFORM_REDIRECT_URI: "http://localhost:8000/api/v1/auth/typeform/basic/callback"
      TYPEFORM_SCOPE: "accounts:read"
      # Stripe
      STRIPE_SUCCESS_URL: ${STRIPE_REDIRECT_URL}
      STRIPE_CANCEL_URL: ${STRIPE_REDIRECT_URL}
      STRIPE_RETURN_URL: ${STRIPE_REDIRECT_URL}
      DATABASE_URL: postgresql+asyncpg://bc_auth:${BC_AUTH_PASSWORD}@app-postgres:5432/bettercollected
      # every route but /ready and POST /stripe/webhooks requires it
      AUTH_INTERNAL_NOTIFY_KEY: ${AUTH_INTERNAL_NOTIFY_KEY:?set by deploy.sh in the root .env}
      # this stack's own signing and encryption keys, generated by deploy.sh
      # into the root .env (deploy/generate-secrets.sh); auth refuses to start
      # without them or with a value published in the repository
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set by deploy.sh in the root .env}
      AUTH_AES_HEX_KEY: ${AUTH_AES_HEX_KEY:?set by deploy.sh in the root .env}
      # DB_AUTO_MIGRATE: "true"   # see the backend service above
      # Single sign-on (docs/sso.md): auth runs the OAuth code exchange with
      # Polis; it never needs the Polis admin API key.
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_POLIS_URL: ${SSO_POLIS_URL:-}
      SSO_POLIS_INTERNAL_URL: http://polis:5225
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
    volumes:
      - settings-snapshots-auth:/var/lib/bc-settings
    depends_on:
      mongodb:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
    healthcheck:
      # No curl/wget in this image — use python3 (present) against /ready.
      test: ['CMD', 'python3', '-c', "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    env_file:
      - .env.deployment

  integrations-typeform:
    image: bettercollected/integrations-typeform:nightly
    # image: bettercollected/integrations-typeform:nightly
    environment:
      # this stack's own signing and encryption keys, generated by deploy.sh
      # into the root .env (deploy/generate-secrets.sh)
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set by deploy.sh in the root .env}
      AUTH_AES_HEX_KEY: ${AUTH_AES_HEX_KEY:?set by deploy.sh in the root .env}
      MASTER_ENCRYPTION_KEYSET: ${MASTER_ENCRYPTION_KEYSET:?set by deploy.sh in the root .env}
    env_file:
      - .env.deployment

  integrations-googleform:
    image: bettercollected/integrations-google:nightly
    environment:
      # the signed settings snapshot (a rollback floor and a DB-down fallback) must
      # survive container recreation: keep it on a named volume
      SETTINGS_SNAPSHOT_DIR: /var/lib/bc-settings
      # the internal API serves no /docs, /redoc or /openapi.json unless true
      API_DOCS_ENABLED: "false"
      # debug mode answers unhandled errors with an HTML traceback; keep it off
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://bc_google:${BC_GOOGLE_PASSWORD}@app-postgres:5432/bettercollected
      # calls the auth service's /users, which requires it
      AUTH_INTERNAL_NOTIFY_KEY: ${AUTH_INTERNAL_NOTIFY_KEY:?set by deploy.sh in the root .env}
      # this stack's own signing and encryption keys, generated by deploy.sh
      # into the root .env (deploy/generate-secrets.sh); the services refuse
      # to start without them or with a value published in the repository
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set by deploy.sh in the root .env}
      AUTH_AES_HEX_KEY: ${AUTH_AES_HEX_KEY:?set by deploy.sh in the root .env}
      MASTER_ENCRYPTION_KEYSET: ${MASTER_ENCRYPTION_KEYSET:?set by deploy.sh in the root .env}
      # DB_AUTO_MIGRATE: "true"   # see the backend service above
    env_file:
      - .env.deployment
    volumes:
      - settings-snapshots-google:/var/lib/bc-settings
    depends_on:
      app-postgres:
        condition: service_healthy

  # Self-hosted product analytics (see plans/umami-self-hosted-form-analytics.md).
  # First-pass exposure: plain host port 3003, no TLS/reverse-proxy — put it
  # behind nginx/TLS yourself for a production deployment.
  #
  # No manual website setup needed: the backend auto-provisions a website
  # named UMAMI_WEBSITE_NAME (default "BetterCollected") on first boot if
  # UMAMI_WEBSITE_ID is unset — see backend/AGENTS.md "Analytics (Umami)".
  # You only need to set UMAMI_SCRIPT_URL (webapp, browser-facing, e.g.
  # http://<host>:3003/script.js) in .env.deployment; log into
  # http://<host>:3003 as admin/umami just to change the default password.
  #
  # `deploy.sh` auto-generates UMAMI_APP_SECRET below into a root `.env` file
  # on first run (docker compose's own var-substitution file — it's not read
  # from .env.deployment, which only supplies container env). Running the
  # compose file directly instead of via deploy.sh? Set it yourself first:
  #   echo "UMAMI_APP_SECRET=$(openssl rand -hex 32)" >> .env
  umami-postgresql:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 5s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: always
    ports:
      - '3003:3000'
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-postgresql:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      umami-postgresql:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/heartbeat']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

version: '3.7'
volumes:
  doc-sandbox:
  settings-snapshots-backend:
  settings-snapshots-auth:
  settings-snapshots-google:
  settings-snapshots-jobs:
  mongo-data:
  app-postgres-data:
  umami-db-data:
  temporal-postgres-data:
networks:
  # Carries the admin service's published port, and nothing else, so the peer
  # address it sees for host traffic is this network's gateway.
  admin-edge:
    ipam:
      config:
        - subnet: ${ADMIN_EDGE_SUBNET:-172.30.77.0/29}
          gateway: ${ADMIN_EDGE_GATEWAY:-172.30.77.1}
  # Private path between the admin service and app-postgres. internal: no
  # gateway, no published ports, no route out; only those two attach.
  admin-db:
    internal: true
services:
  # MongoDB is no longer part of the stack: since 4.1 every service is served from
  # Postgres. It starts only under the `legacy-mongo` profile, which deploy.sh
  # uses once, to import a 4.0 stack's Mongo data into Postgres
  # (docs/postgres-cutover-runbook.md, "Upgrading to 4.1"); it stops and
  # removes the container afterwards and keeps the mongo-data volume. A new
  # stack never starts it.
  mongodb:
    image: mongo:latest
    profiles: ["legacy-mongo"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      # Internal only (no published port). deploy.sh generates the password for a
      # new volume; the variable is only read when the volume is created, so a
      # volume from an earlier release keeps `root` (the default here).
      MONGO_INITDB_ROOT_PASSWORD: ${BC_MONGO_ROOT_PASSWORD:-root}
    volumes:
      - mongo-data:/data/db
    restart: always
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Removes the `seeduser` account earlier releases created. It no longer seeds any
  # data: the reference data (allowed origins, the Google Forms provider) is in
  # Postgres since 4.1, seeded once by deploy.sh (python -m backend.seed_refdata).
  # Under the `legacy-mongo` profile with MongoDB; deploy.sh never starts it.
  mongo-seed:
    profiles: ["legacy-mongo"]
    build:
      context: .
      dockerfile: Dockerfile.deployment.mongo-seed
    environment:
      MONGO_ROOT_PASSWORD: ${BC_MONGO_ROOT_PASSWORD:-root}
    depends_on:
      mongodb:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: on-failure




  # If you want to run webapp locally without using docker-compose,
  # you will also need to run nginx locally and not from docker-compose
  webapp:
    image: bettercollected/webapp:nightly
    # image: bettercollected/webapp:nightly
    environment:
      INTERNAL_DOCKER_API_ENDPOINT_HOST: http://backend:8000/api/v1
      API_ENDPOINT_HOST: http://localhost:8000/api/v1
      ADMIN_DOMAIN: localhost:3000
      CLIENT_DOMAIN: localhost:3001
      NEXT_PUBLIC_NODE_ENV: development
      # Single sign-on UI (docs/sso.md), read at runtime; the same root .env
      # switch as the backend and auth
      SSO_ENABLED: ${SSO_ENABLED:-false}
    # Its own env file, not .env.deployment: the public webapp must not receive the
    # backend's secrets (Stripe, Google, mail, Mongo, keys). deploy.sh creates
    # .env.webapp once from the lines of .env.deployment the webapp reads; it is
    # optional so a plain `docker compose config` works without it.
    env_file:
      - path: .env.webapp
        required: false
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
      auth:
        condition: service_healthy

  postgresql:
    environment:
      # Internal only (no published port). deploy.sh generates the password into
      # the root .env for a new volume; a volume created by an earlier release keeps
      # its original password, which is the default here (docs/admin-service.md).
      POSTGRES_PASSWORD: ${BC_TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_USER: temporal
    # Pinned (not `postgres:latest`): an unpinned tag silently moves to new
    # major versions, which refuse to start against an old major version's
    # on-disk format (hit this directly while testing — `latest` had already
    # drifted to Postgres 18, which won't read older data at all). Matches
    # umami-postgresql's major version below for consistency.
    image: postgres:15-alpine
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U temporal']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
  temporal:
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      # NOT "postgresql" — temporalio/auto-setup only recognizes mysql8,
      # postgres12, postgres12_pgx, cassandra as DB drivers. The old value
      # silently failed at startup ("Unsupported driver specified") with no
      # healthcheck to surface it; caught this via the healthcheck added below.
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${BC_TEMPORAL_DB_PASSWORD:-temporal}
      - POSTGRES_SEEDS=postgresql
      # Without this, auto-setup binds to the container's dynamic bridge IP
      # (logged as "TEMPORAL_ADDRESS is not set, setting it to <ip>:7233"),
      # which isn't reachable via localhost from inside the same container —
      # breaks any localhost-based healthcheck/CLI use. Pin it to the compose
      # service name, which is also what worker/backend already use to reach it.
      - TEMPORAL_ADDRESS=temporal:7233
    image: temporalio/auto-setup
    # No published port: Temporal's frontend has no authentication, so anything
    # that reaches 7233 can start, signal or terminate workflows. Only the
    # compose network (backend, worker) talks to it. To inspect it from the
    # host: `docker compose exec temporal temporal ...`.
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', 'temporal:7233']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Application database — the consolidation target for MongoDB and Temporal
  # (plans/postgres-consolidation.md). One schema per service (app / auth /
  # google / jobs), one least-privilege role each, created on the volume's first
  # start by postgres/init/01-roles-schemas.sh from the passwords below.
  # `deploy.sh` generates APP_POSTGRES_PASSWORD and the BC_*_PASSWORD values into
  # the root `.env` on first run (compose's var-substitution file, exactly like
  # UMAMI_APP_SECRET). Running the compose file directly? Set them yourself —
  # the `:?` markers make compose refuse to start with them missing rather than
  # bring up a database with empty passwords. Major version pinned for the same
  # reason as the Temporal postgres above.
  app-postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: bettercollected
      POSTGRES_USER: bettercollected
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?set by deploy.sh in the root .env}
      BC_APP_PASSWORD: ${BC_APP_PASSWORD:?set by deploy.sh in the root .env}
      BC_AUTH_PASSWORD: ${BC_AUTH_PASSWORD:?set by deploy.sh in the root .env}
      BC_GOOGLE_PASSWORD: ${BC_GOOGLE_PASSWORD:?set by deploy.sh in the root .env}
      BC_JOBS_EXEC_PASSWORD: ${BC_JOBS_EXEC_PASSWORD:?set by deploy.sh in the root .env}
      # read by postgres/ensure-admin-roles.sh, which deploy.sh runs here on every deploy
      BC_ADMIN_PASSWORD: ${BC_ADMIN_PASSWORD:?set by deploy.sh in the root .env}
      BC_ADMIN_MIG_PASSWORD: ${BC_ADMIN_MIG_PASSWORD:?set by deploy.sh in the root .env}
      BC_TASKS_PASSWORD: ${BC_TASKS_PASSWORD:?set by deploy.sh in the root .env}
      BC_TASKS_DATA_APP_PASSWORD: ${BC_TASKS_DATA_APP_PASSWORD:?set by deploy.sh in the root .env}
      BC_TASKS_DATA_GOOGLE_PASSWORD: ${BC_TASKS_DATA_GOOGLE_PASSWORD:?set by deploy.sh in the root .env}
    # explicit priorities: without them Compose 2.24 / Engine 27 sometimes left
    # this container on one network only (docs/admin-service.md)
    networks:
      default:
        priority: 100
      admin-db:
        priority: 50
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP (-h): while the image first initialises a volume it runs a temporary
      # server that listens on the unix socket only and has not created the database
      # yet. A socket check passes then, `deploy.sh` goes on to the next step
      # ("database bettercollected does not exist"), and a slow disk makes that
      # window long. The temporary server never listens on TCP.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U bettercollected -d bettercollected']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    image: bettercollected/temporal-worker:nightly
    environment:
      TEMPORAL_SERVER_URL: temporal:7233
      # The worker stays off the settings store and never gets the master key: it
      # runs a browser on user-supplied URLs. It keeps two copies of keys the
      # store holds, written to the root .env by deploy.sh (bootstrap-keys
      # --export-worker): API_KEY is the backend's TEMPORAL_API_KEY (its internal
      # job routes require it), AES_HEX_KEY the stack's AUTH_AES_HEX_KEY (a Fernet
      # key: preview tokens). settings-drift compares both with the store.
      # (`:-`, not `:?`: compose reads this file before the keys exist on a new
      # stack, and deploy.sh writes both before it starts the worker)
      API_KEY: ${API_KEY:-}
      AES_HEX_KEY: ${AES_HEX_KEY:-}
    # Its own env file, not .env.deployment: this service drives a browser on
    # user-supplied URLs and gets only what it reads (SERVER_URL, NAMESPACE,
    # COOKIE_DOMAIN, WORKER_QUEUE, WORKERS, MAX_THREAD_POOL_EXECUTORS,
    # ELASTIC_APM_*), written by deploy.sh once into .env.worker.
    env_file:
      - path: .env.worker
        required: false
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      temporal:
        condition: service_healthy
  # You need to run nginx only if your webapp is running locally without using docker-compose
  # You may need to setup nginx locally with same configs provided inside `./nginx.conf`
  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx-deployment.conf:/etc/nginx/conf.d/nginx-deployment.conf:ro
    ports:
      - '3001:3001'
      - '3002:3002'
      # Umami's tracker script and event endpoints only (nginx-deployment.conf);
      # its dashboard and login are not reachable from the network
      - '3003:3003'
    # nginx resolves the `webapp` upstream when it starts and exits when the name is
    # not known yet. deploy.sh creates containers one at a time, so without this it
    # started before the webapp existed and stayed down: wait for the webapp, and
    # start again if it still goes down (a recreated webapp, a host reboot).
    depends_on:
      webapp:
        condition: service_started
    restart: unless-stopped


  backend:
    image: bettercollected/backend:nightly
    # image: bettercollected/backend:nightly
    environment:
      # Settings come from the settings store (docs/settings-loader.md): the
      # service refuses to start when it cannot read it. SETTINGS_STORE=off in
      # the root .env is the rollback to the old environment-only behaviour.
      SETTINGS_STORE: ${SETTINGS_STORE:-required}
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY:?set by deploy.sh in the root .env}
      # the signed settings snapshot (a rollback floor and a DB-down fallback) must
      # survive container recreation: keep it on a named volume
      SETTINGS_SNAPSHOT_DIR: /var/lib/bc-settings
      # DEBUG and API_DOCS_ENABLED are deliberately not set here: both default to
      # off in the code, and a value pinned here would silently win over the
      # portal.
      AUTH_BASE_URL: http://auth:8000/api/v1
      DATABASE_URL: postgresql+asyncpg://bc_app:${BC_APP_PASSWORD}@app-postgres:5432/bettercollected
      # Every group is served from Postgres (4.1): MongoDB is not part of the stack.
      # The backend and the jobs worker always carry the same values.
      DB_READ_SOURCE: ${DB_READ_SOURCE:-postgres}
      DB_WRITE_MODE: ${DB_WRITE_MODE:-postgres}
      # Keys the store holds (generated by `bootstrap-keys` on a new stack,
      # imported by deploy.sh on an upgrade). They are passed through from the
      # root .env only so an upgrade can import them and so an operator can
      # override the store in an emergency; an empty value means "read the
      # store". `deploy.sh settings-prune` removes them from the files.
      AUTH_INTERNAL_NOTIFY_KEY: ${AUTH_INTERNAL_NOTIFY_KEY:-}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_AES_HEX_KEY: ${AUTH_AES_HEX_KEY:-}
      MASTER_ENCRYPTION_KEYSET: ${MASTER_ENCRYPTION_KEYSET:-}
      # The key the task runner presents to the internal admin-task routes
      # (auth.resolve_case_duplicate_accounts); the same value on task-runner.
      # Environment only. Unset: those routes answer 503.
      ADMIN_TASKS_API_KEY: ${ADMIN_TASKS_API_KEY:-}
      # Internal listener (docs/admin-service.md, "Internal routes"): the
      # key-only routes of the task runner and the workers are served on this
      # second port, which is never published (no `ports:` entry, no proxy).
      # The admin-task routes answer there only. API_INTERNAL_ROUTES=direct
      # (the default) still lets the workers reach theirs on 8000 directly;
      # internal_port refuses them there once every caller uses 8001.
      API_INTERNAL_PORT: ${API_INTERNAL_PORT:-8001}
      API_INTERNAL_ROUTES: ${API_INTERNAL_ROUTES:-direct}
      # Schema migrations: deploy.sh runs them before the services roll. A stack
      # deployed without it (Docker Swarm / docker stack deploy, CI) can let each
      # service migrate its own schema at startup instead — replicas serialise on
      # a Postgres advisory lock — by setting, here or in .env.deployment:
      # DB_AUTO_MIGRATE: "true"
      # Client addresses: the TCP peer is the client unless it is listed here.
      # TRUSTED_PROXIES (or API_TRUSTED_PROXIES) in the root .env imports into the
      # store (the API_TRUSTED_PROXIES setting: comma-separated addresses/CIDRs
      # of your reverse proxy, IPv4 and IPv6) and can then be changed in the portal.
      API_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-${API_TRUSTED_PROXIES:-}}
      # PDF form import: documents are only opened by the isolated document-sandbox
      PDF_IMPORT_SANDBOX_SOCKET: /run/doc-sandbox/sandbox.sock
      PDF_IMPORT_REQUIRE_ISOLATED_SANDBOX: "true"
      # Single sign-on (docs/sso.md) stays environment-driven in this release:
      # deploy.sh reads SSO_ENABLED from the root .env to add the Polis overlay
      # docker-compose.sso-deployment.yml. All SSO_* values come from the root .env.
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_POLIS_URL: ${SSO_POLIS_URL:-}
      SSO_POLIS_INTERNAL_URL: http://polis:5225
      SSO_POLIS_API_KEY: ${SSO_POLIS_API_KEY:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
      SSO_SAML_AUDIENCE: ${SSO_SAML_AUDIENCE:-}
      # the platform admins' email domains (the root .env's list, the admin
      # portal's) can't be claimed as verified domains (docs/verified-domains.md);
      # empty leaves a PLATFORM_ADMIN_EMAILS from .env.deployment in force
      VERIFIED_DOMAINS_PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
    # .env.deployment is the operator's own file and is not tracked; deploy.sh
    # creates it from .env.deployment.example when it is missing. Optional
    # (Compose 2.24+) here and in the other three services that read it, so
    # `docker compose config` works on a fresh checkout before deploy.sh ran.
    env_file:
      - path: .env.deployment
        required: false
    # no cap_drop here: root needs CAP_DAC_OVERRIDE to open the document sandbox's
    # socket directory (owned by the sandbox user, mode 0770)
    security_opt:
      - no-new-privileges:true
    volumes:
      - settings-snapshots-backend:/var/lib/bc-settings
      - doc-sandbox:/run/doc-sandbox
    # 8000 only: never publish the internal listener (API_INTERNAL_PORT, 8001)
    ports:
      - '8000:8000'
    depends_on:
      temporal:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
      umami:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1/public/v1/openapi.json']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Internal admin service (docs/admin-service.md). Published on the host's
  # loopback only and never routed by nginx; reach it with `ssh -L`.
  # Networks: `admin-edge` (pinned, only this service) carries the published
  # port, so Docker's NAT shows the service a known gateway address that
  # ADMIN_ALLOWED_IPS admits; `admin-db` (internal) is its private path to
  # app-postgres. It is NOT on `default`, so no sibling container can reach it.
  # No env_file: only the variables below. The portal starts only when
  # ADMIN_DATABASE_URL, SETTINGS_MASTER_KEY and PLATFORM_ADMIN_EMAILS are all
  # non-empty; otherwise the service runs as the bare gate (health check and
  # 404s). The three default to empty so `docker compose config` and older
  # deployments keep working; deploy.sh generates the first two, and
  # PLATFORM_ADMIN_EMAILS (the super admin list) is set by the operator.
  admin:
    image: bettercollected/backend:nightly
    command: ["/api/backend/.venv/bin/python", "-m", "backend.admin.serve"]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    environment:
      ADMIN_BIND_HOST: 0.0.0.0
      ADMIN_LISTEN_PORT: "8000"
      ADMIN_PORT: ${ADMIN_PORT:-8100}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-127.0.0.1/32}
      ADMIN_ALLOWED_HOSTS: ${ADMIN_ALLOWED_HOSTS:-localhost:${ADMIN_PORT:-8100},127.0.0.1:${ADMIN_PORT:-8100}}
      ADMIN_PUBLIC_ORIGINS: ${ADMIN_PUBLIC_ORIGINS:-http://localhost:${ADMIN_PORT:-8100},http://127.0.0.1:${ADMIN_PORT:-8100}}
      ADMIN_TRUSTED_PROXIES: ${ADMIN_TRUSTED_PROXIES:-}
      ADMIN_EDGE_GATEWAY: ${ADMIN_EDGE_GATEWAY:-172.30.77.1}
      # the bc_admin role sees only schema `admin` (postgres/ensure-admin-roles.sh);
      # empty without the password, which keeps the service in bare-gate mode
      ADMIN_DATABASE_URL: ${BC_ADMIN_PASSWORD:+postgresql+asyncpg://bc_admin:${BC_ADMIN_PASSWORD}@app-postgres:5432/bettercollected}
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      # sign-in codes and notices go out through the same SMTP settings as the
      # other services (root .env)
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_SERVER: ${MAIL_SMTP_SERVER:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SENDER: ${MAIL_SENDER:-}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-}
      MAIL_SSL_TLS: ${MAIL_SSL_TLS:-}
      MAIL_USE_CREDENTIALS: ${MAIL_USE_CREDENTIALS:-}
      MAIL_VALIDATE_CERTS: ${MAIL_VALIDATE_CERTS:-}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8100}:8000"
    networks:
      admin-edge:
        priority: 100
      admin-db:
        priority: 50
    depends_on:
      app-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api/backend/.venv/bin/python", "-I", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read() == b'ok' else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # The data task runner for the internal admin service: claims signed task
  # requests from the tasks schema and runs them. Started by deploy.sh
  # (like `admin`); it can be restarted on its own with `docker compose up -d task-runner`. Isolated on
  # purpose: no published port, no env_file, only the two variables it needs, its
  # own database role (bc_tasks), read-only filesystem, no capabilities, and not
  # attached to admin-edge. Task implementations that need Mongo or other
  # services add exactly the variables they need here.
  task-runner:
    image: bettercollected/backend:nightly
    command: ["/api/backend/.venv/bin/python", "-m", "backend.admin.runner"]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    environment:
      TASKS_DATABASE_URL: postgresql+asyncpg://bc_tasks:${BC_TASKS_PASSWORD:?set by deploy.sh in the root .env}@app-postgres:5432/bettercollected
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY:?set by deploy.sh in the root .env}
      # The responses tasks (responses.check_undecryptable,
      # responses.backfill_workspaces) read and, for the backfill, write the
      # stored responses, so they need the data stores and the keyset. All four
      # are empty unless set in the root .env; a task then refuses with
      # store_not_configured or keyset_missing, and nothing else is affected.
      # Defaults to bc_tasks_data_app, a dedicated role with only the column grants
      # these tasks need on the app schema (postgres/ensure-admin-roles.sh); the Google
      # credentials have a role of their own (bc_tasks_data_google), because one role
      # over two owners' tables would let either owner plant code that runs with access
      # to the other's. Set
      # TASK_RUNNER_DATABASE_URL to another dedicated role if you must, never the
      # backend's: that would hand the runner the whole app schema next to the
      # keyset. For Mongo, prefer a read-only user for the check and the dry runs.
      DATABASE_URL: ${TASK_RUNNER_DATABASE_URL:-postgresql+asyncpg://bc_tasks_data_app:${BC_TASKS_DATA_APP_PASSWORD}@app-postgres:5432/bettercollected}
      GOOGLE_DATABASE_URL: ${TASK_RUNNER_GOOGLE_DATABASE_URL:-postgresql+asyncpg://bc_tasks_data_google:${BC_TASKS_DATA_GOOGLE_PASSWORD}@app-postgres:5432/bettercollected}
      MONGO_URI: ${TASK_RUNNER_MONGO_URI:-}
      MONGO_DB: ${TASK_RUNNER_MONGO_DB:-}
      MASTER_ENCRYPTION_KEYSET: ${TASK_RUNNER_KEYSET:-}
      # which stores the services write (their DB_WRITE_MODE, kept equal; the
      # backend's default, postgres, since 4.1): what `stores: auto` covers and,
      # for keyset.drop_old, which store is primary and whether mongo_retired is
      # accepted. The Google credentials are in Postgres only since 4.1 (no
      # write mode). And the Google integration's Mongo database
      DB_WRITE_MODE: ${DB_WRITE_MODE:-postgres}
      DB_WRITE_MODE__RESPONSES: ${DB_WRITE_MODE__RESPONSES:-}
      GOOGLE_MONGO_DB: ${TASK_RUNNER_GOOGLE_MONGO_DB:-}
      # auth.resolve_case_duplicate_accounts holds no access to the accounts: it
      # calls the API's internal admin-task routes, which decide and start the
      # product's account deletion. Unset key: the task refuses
      # (backend_not_configured); the same value as the backend's.
      ADMIN_TASKS_API_KEY: ${ADMIN_TASKS_API_KEY:-}
      ADMIN_TASKS_BACKEND_URL: ${TASK_RUNNER_BACKEND_URL:-http://backend:8001/api/v1}
    # The image's own HEALTHCHECK probes port 8000, which this service does not serve:
    # left in place it reports the container unhealthy for good. It reports to the
    # portal's /health page through its heartbeat instead.
    healthcheck:
      disable: true
    depends_on:
      app-postgres:
        condition: service_healthy
    restart: unless-stopped

  # Opens uploaded PDF forms for the import (#698, #703). Isolated on purpose:
  # unprivileged user, no network, read-only filesystem, no capabilities, a
  # seccomp syscall allowlist and no environment file (it holds no secrets). The backend and the jobs worker reach
  # it over a Unix socket on the doc-sandbox volume.
  document-sandbox:
    image: bettercollected/backend:nightly
    command: ["/api/backend/.venv/bin/python", "-I", "/api/backend/backend/app/services/pdf_import/server.py", "/run/doc-sandbox/sandbox.sock"]
    user: "65534:65534"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # only the syscalls parsing and rendering need, no network sockets
      # (deploy/seccomp/README.md); path relative to the repository root
      - seccomp=./deploy/seccomp/document-sandbox.json
    pids_limit: 64
    # DOC_SANDBOX_PARALLEL x PDF_IMPORT_SANDBOX_MEMORY_MB (1536) + 512m for the server
    mem_limit: 3584m
    cpus: 2
    environment:
      DOC_SANDBOX_PARALLEL: "2"
    volumes:
      - doc-sandbox:/run/doc-sandbox
    healthcheck:
      test: ["CMD", "/api/backend/.venv/bin/python", "-I", "-c", "import socket; s = socket.socket(socket.AF_UNIX); s.connect('/run/doc-sandbox/sandbox.sock')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Consumes the procrastinate `default` queue (delete_user, delete_response) when
  # JOBS_BACKEND routes those to Postgres; same image and env as the backend.
  jobs-worker:
    image: bettercollected/backend:nightly
    command: ["/api/backend/.venv/bin/python", "-m", "backend.jobs.worker"]
    environment:
      # reads the same settings as the backend (same database role), with a
      # snapshot volume of its own
      SETTINGS_STORE: ${SETTINGS_STORE:-required}
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY:?set by deploy.sh in the root .env}
      SETTINGS_SNAPSHOT_DIR: /var/lib/bc-settings
      AUTH_BASE_URL: http://auth:8000/api/v1
      DATABASE_URL: postgresql+asyncpg://bc_app:${BC_APP_PASSWORD}@app-postgres:5432/bettercollected
      # Every group is served from Postgres (4.1): MongoDB is not part of the stack.
      # The backend and the jobs worker always carry the same values.
      DB_READ_SOURCE: ${DB_READ_SOURCE:-postgres}
      DB_WRITE_MODE: ${DB_WRITE_MODE:-postgres}
      # keys the store holds: see the backend service above
      AUTH_INTERNAL_NOTIFY_KEY: ${AUTH_INTERNAL_NOTIFY_KEY:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_AES_HEX_KEY: ${AUTH_AES_HEX_KEY:-}
      MASTER_ENCRYPTION_KEYSET: ${MASTER_ENCRYPTION_KEYSET:-}
      # PDF form import: documents are only opened by the isolated document-sandbox
      PDF_IMPORT_SANDBOX_SOCKET: /run/doc-sandbox/sandbox.sock
      PDF_IMPORT_REQUIRE_ISOLATED_SANDBOX: "true"
      # deleting a user's workspaces also deletes their SSO connections in Polis
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_POLIS_URL: ${SSO_POLIS_URL:-}
      SSO_POLIS_INTERNAL_URL: http://polis:5225
      SSO_POLIS_API_KEY: ${SSO_POLIS_API_KEY:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
    env_file:
      - path: .env.deployment
        required: false
    security_opt:
      - no-new-privileges:true
    volumes:
      - doc-sandbox:/run/doc-sandbox
      - settings-snapshots-jobs:/var/lib/bc-settings
    # the image's own HEALTHCHECK probes port 8000, which a queue worker does not serve:
    # left in place it reports the container unhealthy for good
    healthcheck:
      disable: true
    depends_on:
      app-postgres:
        condition: service_healthy

  auth:
    image: bettercollected/auth:nightly
    # image: bettercollected/auth:nightly
    environment:
      SETTINGS_STORE: ${SETTINGS_STORE:-required}
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY:?set by deploy.sh in the root .env}
      # the signed settings snapshot (a rollback floor and a DB-down fallback) must
      # survive container recreation: keep it on a named volume
      SETTINGS_SNAPSHOT_DIR: /var/lib/bc-settings
      # DEBUG and API_DOCS_ENABLED: not pinned, see the backend service
      DATABASE_URL: postgresql+asyncpg://bc_auth:${BC_AUTH_PASSWORD}@app-postgres:5432/bettercollected
      # keys the store holds: see the backend service above
      AUTH_INTERNAL_NOTIFY_KEY: ${AUTH_INTERNAL_NOTIFY_KEY:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_AES_HEX_KEY: ${AUTH_AES_HEX_KEY:-}
      # Stripe: one root .env value expands to the three return URLs (imported
      # once; empty means "read the store")
      STRIPE_SUCCESS_URL: ${STRIPE_REDIRECT_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_REDIRECT_URL:-}
      STRIPE_RETURN_URL: ${STRIPE_REDIRECT_URL:-}
      # DB_AUTO_MIGRATE: "true"   # see the backend service above
      # Single sign-on (docs/sso.md): auth runs the OAuth code exchange with
      # Polis; it never needs the Polis admin API key.
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_POLIS_URL: ${SSO_POLIS_URL:-}
      SSO_POLIS_INTERNAL_URL: http://polis:5225
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
    volumes:
      - settings-snapshots-auth:/var/lib/bc-settings
    depends_on:
      app-postgres:
        condition: service_healthy
    healthcheck:
      # No curl/wget in this image — use python3 (present) against /ready.
      test: ['CMD', 'python3', '-c', "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    env_file:
      - path: .env.deployment
        required: false
    security_opt:
      - no-new-privileges:true

  integrations-googleform:
    image: bettercollected/integrations-google:nightly
    environment:
      SETTINGS_STORE: ${SETTINGS_STORE:-required}
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY:?set by deploy.sh in the root .env}
      # the signed settings snapshot (a rollback floor and a DB-down fallback) must
      # survive container recreation: keep it on a named volume
      SETTINGS_SNAPSHOT_DIR: /var/lib/bc-settings
      # DEBUG and API_DOCS_ENABLED: not pinned, see the backend service
      DATABASE_URL: postgresql+asyncpg://bc_google:${BC_GOOGLE_PASSWORD}@app-postgres:5432/bettercollected
      # keys the store holds: see the backend service above
      AUTH_INTERNAL_NOTIFY_KEY: ${AUTH_INTERNAL_NOTIFY_KEY:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_AES_HEX_KEY: ${AUTH_AES_HEX_KEY:-}
      MASTER_ENCRYPTION_KEYSET: ${MASTER_ENCRYPTION_KEYSET:-}
      # DB_AUTO_MIGRATE: "true"   # see the backend service above
    env_file:
      - path: .env.deployment
        required: false
    security_opt:
      - no-new-privileges:true
    volumes:
      - settings-snapshots-google:/var/lib/bc-settings
    depends_on:
      app-postgres:
        condition: service_healthy

  # Self-hosted product analytics (see plans/umami-self-hosted-form-analytics.md).
  # Respondents' browsers need the tracker script and its event endpoint only:
  # nginx publishes exactly those on port 3003 (plain HTTP: put TLS in front of
  # it), and the dashboard and login are on 127.0.0.1:3004. deploy.sh still
  # replaces Umami's built-in admin/umami login with a generated password after
  # the first start (and on an upgrade, when the built-in login still works) and
  # stores it as the backend's UMAMI_PASSWORD setting. Its database is internal
  # only.
  #
  # No manual website setup needed: the backend auto-provisions a website
  # named UMAMI_WEBSITE_NAME (default "BetterCollected") on first boot if
  # UMAMI_WEBSITE_ID is unset — see backend/AGENTS.md "Analytics (Umami)".
  # You only need to set UMAMI_SCRIPT_URL (webapp, browser-facing, e.g.
  # http://<host>:3003/script.js) in .env.webapp (deploy.sh copies it from .env.deployment once).
  #
  # `deploy.sh` auto-generates UMAMI_APP_SECRET and BC_UMAMI_DB_PASSWORD below
  # into a root `.env` file on first run (docker compose's own var-substitution
  # file — it's not read from .env.deployment, which only supplies container
  # env). Running the compose file directly instead of via deploy.sh? Set
  # UMAMI_APP_SECRET yourself first:
  #   echo "UMAMI_APP_SECRET=$(openssl rand -hex 32)" >> .env
  # A database volume created by an earlier release keeps its original
  # password (`umami`), which is what an unset BC_UMAMI_DB_PASSWORD means.
  umami-postgresql:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${BC_UMAMI_DB_PASSWORD:-umami}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U umami -d umami']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: always
    # The dashboard and its login are published on the host's loopback only
    # (reach it with `ssh -L 3004:127.0.0.1:3004 <host>`). Respondents' browsers
    # reach just the tracker script and the event endpoints, through nginx on
    # port 3003 (nginx-deployment.conf).
    ports:
      - '127.0.0.1:3004:3000'
    environment:
      DATABASE_URL: postgresql://umami:${BC_UMAMI_DB_PASSWORD:-umami}@umami-postgresql:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      umami-postgresql:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/heartbeat']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

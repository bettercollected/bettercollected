[tool.black]
line-length = 88
target-version = ['py36', 'py37', 'py38', 'py39', 'py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
  | profiling
)/
'''


[project]
name = "common"
version = "0.1.0"
description = "This project was generated with fastapi-mvc."
authors = [{ name = "nabin6246", email = "nabin62246@gmail.com" }]
license = { text = "no" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.30.0",
    "beanie>=2.1.0",
    "cryptography>=50.0.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "tink>=1.14.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
managed = true
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]


[tool.coverage.report]
exclude_lines = [
    "pass",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# importlib mode: resolve `common` to the installed (editable) package instead of
# prepending a parent directory to sys.path — this project dir has its own stray
# __init__.py, which otherwise makes `import common` hit the directory, not the package.
addopts = "--import-mode=importlib"

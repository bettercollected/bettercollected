[workspace]
members = [
    "bc-config",
    "bc-db",
    "bc-auth",
    "bc-authz",
    "bc-crypto",
    "bc-http",
    "bc-api",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# internal crates
bc-config = { path = "bc-config" }
bc-db = { path = "bc-db" }
bc-auth = { path = "bc-auth" }
bc-authz = { path = "bc-authz" }
bc-crypto = { path = "bc-crypto" }
bc-http = { path = "bc-http" }

# external crates (every version is chosen here, once)
aes-gcm = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
ipnet = "2"
jsonwebtoken = { version = "9", default-features = false }
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "macros", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# a crate that reports errors says so in its types; prose on each is noise
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
# a secret must never be logged or printed by a stray macro
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
strip = true

[profile.dev]
# a smaller target directory and faster links; debug info is not needed in CI
debug = "line-tables-only"

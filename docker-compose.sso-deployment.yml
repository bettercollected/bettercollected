# Enterprise single sign-on (docs/sso.md): an overlay on
# docker-compose.deployment.yml, used only when SSO_ENABLED=true:
#
#   docker compose -f docker-compose.deployment.yml -f docker-compose.sso-deployment.yml up -d
#
# deploy.sh adds it, and generates the secrets below into the root .env, when
# the root .env has SSO_ENABLED=true. Without SSO this file is never read, so
# a deployment without SSO needs none of these values.
#
# Ory Polis (formerly BoxyHQ SAML Jackson) turns customers' SAML/OIDC identity
# providers into one OAuth code flow. Isolated: its own Postgres
# (`polis-postgres`, on the internal `polis-db` network only), and the `sso`
# network, which reaches the internet (the customers' IdPs) and the backend,
# the jobs worker and auth (who call it), but not Mongo, app-postgres,
# Temporal or the other services. Bound to localhost: publish only
# /api/oauth/*, /.well-known/* (and /api/scim/* with directory sync)
# through your TLS reverse proxy at
# SSO_POLIS_URL, never the admin API (/api/v1/*) or the admin UI.
services:
  polis:
    # 26.2.0, the version tested; pinned by digest
    image: ${POLIS_IMAGE:-boxyhq/jackson@sha256:9165f3db9d9f5d3262f23446e860f4929f462d1d9c954af13f3bb44910c3a699}
    restart: unless-stopped
    environment:
      EXTERNAL_URL: ${SSO_POLIS_URL:?set SSO_POLIS_URL in the root .env}
      NEXTAUTH_URL: ${SSO_POLIS_URL:?set SSO_POLIS_URL in the root .env}
      DB_ENGINE: sql
      DB_TYPE: postgres
      DB_URL: postgres://bc_polis:${BC_POLIS_PASSWORD:?set by deploy.sh in the root .env}@polis-postgres:5432/polis
      # encrypts Polis's stored connections (IdP metadata, OIDC client secrets)
      DB_ENCRYPTION_KEY: ${POLIS_DB_ENCRYPTION_KEY:?set by deploy.sh in the root .env}
      # the backend's SSO_POLIS_API_KEY
      JACKSON_API_KEYS: ${SSO_POLIS_API_KEY:?set by deploy.sh in the root .env}
      # never the default "dummy": shared by every tenant without PKCE
      CLIENT_SECRET_VERIFIER: ${POLIS_CLIENT_SECRET_VERIFIER:?set by deploy.sh in the root .env}
      NEXTAUTH_SECRET: ${POLIS_NEXTAUTH_SECRET:?set by deploy.sh in the root .env}
      # SP-initiated sign-in only; IdP-initiated logins are refused
      IDP_ENABLED: "false"
      # redirect_uri must equal the connection's (scheme, host, port and path)
      OPENID_REDIRECT_EXACT_MATCH: "true"
      SAML_AUDIENCE: ${SSO_SAML_AUDIENCE:?set SSO_SAML_AUDIENCE in the root .env}
      BOXYHQ_NO_ANALYTICS: "1"
      DO_NOT_TRACK: "1"
    ports:
      - '127.0.0.1:5225:5225'
    networks:
      - sso
      - polis-db
    depends_on:
      polis-postgres:
        condition: service_healthy

  polis-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: polis
      POSTGRES_USER: bc_polis
      POSTGRES_PASSWORD: ${BC_POLIS_PASSWORD:?set by deploy.sh in the root .env}
    volumes:
      - polis-db-data:/var/lib/postgresql/data
    networks:
      - polis-db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bc_polis -d polis']
      interval: 5s
      timeout: 5s
      retries: 10

  # Those who call Polis join its `sso` network as well as the default one.
  backend:
    environment:
      SSO_POLIS_API_KEY: ${SSO_POLIS_API_KEY:?set by deploy.sh in the root .env}
      # SCIM directory sync (docs/sso.md): Polis delivers directory events to
      # the backend over this `sso` network; the directory's id is appended
      SCIM_WEBHOOK_URL: ${SCIM_WEBHOOK_URL:-http://backend:8000/api/v1/scim/webhook}
    networks:
      - default
      - sso
  jobs-worker:
    environment:
      SSO_POLIS_API_KEY: ${SSO_POLIS_API_KEY:?set by deploy.sh in the root .env}
      # the nightly SCIM resync runs here and needs directory sync to be
      # configured, exactly as on the backend
      SCIM_WEBHOOK_URL: ${SCIM_WEBHOOK_URL:-http://backend:8000/api/v1/scim/webhook}
    networks:
      - default
      - sso
  auth:
    networks:
      - default
      - sso

volumes:
  polis-db-data:

networks:
  default:
  # Polis and those who call it (backend, jobs worker, auth); has internet
  # egress for the customers' identity providers
  sso:
  # Polis and its database only, no egress
  polis-db:
    internal: true

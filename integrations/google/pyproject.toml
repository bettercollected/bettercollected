[project]
name = "googleform"
version = "0.1.0"
description = "Google Form integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "no" }
authors = [
    { name = "Bibishan Pandey", email = "bibishan.b.pandey@gmail.com" }
]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi~=0.88.0",
    "uvicorn[standard]~=0.20.0",
    "gunicorn~=22.0.0",
    "redis~=4.4.0",
    "aiohttp==3.10.5",
    "loguru>=0.6.0",
    "requests==2.32.3",
    "fastapi-camelcase>=1.0.5",
    "beanie>=1.17.0",
    "dependency-injector>=4.41.0",
    "classy-fastapi>=0.3.0",
    "pyjwt>=2.6.0",
    "cryptography==43.0.1",
    "google-api-core>=2.11.0",
    "google-api-python-client>=2.80.0",
    "google-auth>=2.16.2",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "googleapis-common-protos>=1.58.0",
    "sentry-sdk[fastapi]>=2.8.0",
    "elastic-apm>=6.17.0",
    "common",
    "pydantic[email]>=1.10.26",
]

[project.scripts]
googleform = "googleform.__main__:main"

[dependency-groups]
dev = [
    "pytest~=7.2.0",
    "pytest-cov~=4.0.0",
    "pytest-asyncio~=0.20.3",
    "httpx~=0.23.1",
    "aioresponses~=0.7.3",
    "flake8~=5.0.4",
    "flake8-docstrings~=1.6.0",
    "flake8-import-order~=0.18.1",
    "flake8-todo>=0.7",
    "black~=24.8.0",
    "pre-commit>=3.0.4",
    "pytest-mock>=3.10.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
omit = [
    "googleform/config/gunicorn.py",
    "googleform/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pass",
]

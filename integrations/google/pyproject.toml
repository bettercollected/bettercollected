[project]
name = "googleform"
version = "0.1.0"
description = "Google Form integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "no" }
authors = [
    { name = "Bibishan Pandey", email = "bibishan.b.pandey@gmail.com" }
]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi>=0.161.1",
    "uvicorn[standard]>=0.54.0",
    "gunicorn>=26.2.0",
    "aiohttp>=3.14.5",
    "loguru>=0.7.3",
    "requests>=2.32.5",
    "fastapi-camelcase>=2.0.0",
    "dependency-injector>=4.49.1",
    "classy-fastapi>=0.7.0",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.0",
    "google-api-core>=2.43.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "googleapis-common-protos>=1.76.0",
    "elastic-apm>=6.26.2",
    "common",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.16.1",
    "h11>=0.16.0",
    "httpx>=0.27.0",
]

[project.scripts]
googleform = "googleform.__main__:main"

[dependency-groups]
dev = [
    # the 4.0 codec, for the golden fixtures only (common/db/codec_golden.py)
    "beanie>=2.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "aioresponses>=0.7.9",
    "flake8>=7.4.1",
    "flake8-docstrings>=1.7.0",
    "flake8-import-order>=0.19.2",
    "flake8-todo>=0.7",
    "black>=26.10.1",
    "pre-commit>=4.7.0",
    "pytest-mock>=3.17.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
omit = [
    "googleform/config/gunicorn.py",
    "googleform/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pass",
]

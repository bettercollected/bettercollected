[project]
name = "googleform"
version = "0.1.0"
description = "Google Form integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "no" }
authors = [
    { name = "Bibishan Pandey", email = "bibishan.b.pandey@gmail.com" }
]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.50.0",
    "gunicorn>=23.0.0",
    "aiohttp>=3.13.3",
    "loguru>=0.7.3",
    "requests>=2.32.5",
    "fastapi-camelcase>=2.0.0",
    "beanie>=1.26.0",
    "dependency-injector>=4.48.0",
    "classy-fastapi>=0.6.0",
    "pyjwt>=2.9.0",
    "cryptography>=44.0.0",
    "google-api-core>=2.20.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.30.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "googleapis-common-protos>=1.63.0",
    "elastic-apm>=6.22.0",
    "common",
    "pydantic[email]>=1.10.0",
    "pydantic-settings>=2.13.0",
    "motor>=3.7.1",
    "h11>=0.16.0",
    "httpx>=0.27.0",
]

[project.scripts]
googleform = "googleform.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "aioresponses>=0.7.6",
    "flake8>=7.0.0",
    "flake8-docstrings>=1.7.0",
    "flake8-import-order>=0.18.2",
    "flake8-todo>=0.7",
    "black>=24.4.0",
    "pre-commit>=3.7.0",
    "pytest-mock>=3.14.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
omit = [
    "googleform/config/gunicorn.py",
    "googleform/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pass",
]

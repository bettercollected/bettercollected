[project]
name = "actions-executor"
version = "0.1.0"
description = "Temporal actions executor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "temporalio==1.34.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "httpx==0.28.1",
    "fastapi-mail>=1.6.1",
    "google-api-python-client==2.201.0",
    "google-auth==2.59.1",
    "cryptography>=50.0.0",
    "elastic-apm==6.26.2",
    "jinja2==3.1.6",
    "email-validator>=2.3.0",
    "pydantic==2.13.5",
    "protobuf==7.36.2",
    "procrastinate>=3.9,<4",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.1.1",
    "types-protobuf==7.35.1.20260906",
]

[tool.uv]
managed = true
package = false

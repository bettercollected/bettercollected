<!doctype html>
<html lang="{{ lang }}" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{{ t.update_subject }}</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0;padding:0;background-color:#F5F7FB;">
<!-- Fixed notice: names the form and links to the submission page. The update
     itself (status, message) is only ever shown on that page. Every value is
     autoescaped (see notification_service.render_submission_update). -->
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
       style="background-color:#F5F7FB;">
    <tr>
        <td align="center" style="padding:40px 16px 16px 16px;">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
                   style="max-width:506px;background-color:#ffffff;border:1px solid #EAECF0;border-radius:6px;">
                <tr>
                    <td align="center"
                        style="padding:40px 32px 16px 32px;font-family:'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:18px;font-weight:600;line-height:1.4;color:#101828;">
                        {{ t.update_heading }}
                    </td>
                </tr>
                <tr>
                    <td align="center"
                        style="padding:0 32px 32px 32px;font-family:'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:400;line-height:1.5;color:#5A6478;">
                        {% if workspace_title %}{{ update_from_workspace }}
                        <span style="color:#101828;">{{ form_title }}</span>.
                        {% else %}{{ t.update_generic }}
                        <span style="color:#101828;">{{ form_title }}</span>.{% endif %}
                        {{ t.update_sign_in }}
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:0 32px 32px 32px;">
                        <a href="{{ link }}"
                           style="display:inline-block;background:#1649E2;color:#ffffff;font-family:'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:600;line-height:120%;text-decoration:none;padding:16px 32px 13px 32px;border-bottom:3px solid #0E2D8F;border-radius:6px;">
                            {{ t.update_button }}
                        </a>
                    </td>
                </tr>
                <tr>
                    <td align="center"
                        style="padding:0 32px 40px 32px;font-family:'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400;line-height:1.5;color:#667085;">
                        {{ t.update_why }}
                        <span style="color:#344054;word-break:break-all;">{{ link }}</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td align="center"
            style="padding:0 16px 40px 16px;font-family:'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12px;font-weight:400;line-height:18px;color:#667085;">
            <a href="https://sireto.com" style="color:#667085;text-decoration:underline;">{{ t.footer_product_of }}</a> &middot; Sireto&reg; {{ t.footer_trademark }}
        </td>
    </tr>
</table>
</body>
</html>

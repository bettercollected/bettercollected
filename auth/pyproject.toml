[project]
name = "auth"
version = "0.1.0"
description = "This project was generated with fastapi-mvc."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "nabin6246", email = "nabin62246@gmail.com" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.50.2",
    "fastapi-users[beanie,oauth]>=15.0.5",
    "dependency-injector>=4.49.1",
    "classy-fastapi>=0.6.0",
    "httpx>=0.27.0",
    "pyjwt>=2.10.0",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.198.0",
    "fastapi-mail>=1.4.1",
    "stripe>=15.3.0",
    "sentry-sdk[fastapi]>=2.64.0",
    "loguru>=0.7.2",
    "elastic-apm>=6.26.2",
    "cryptography>=50.0.0",
    "requests>=2.32.3",
    "common",
    "pydantic-settings>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "black>=25.1.0",
    "pre-commit>=4.6.0",
    "mongomock-motor>=0.0.30",
]

[tool.uv]
managed = true

[tool.uv.sources]
common = { path = "../common" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
omit = [
    "auth/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pass",
]

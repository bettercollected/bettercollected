version: '3.7'

volumes:
    mongo-data:
    umami-db-data:
    rustfs-data:

services:
    mongodb:
        image: mongo:latest
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: root
        ports:
            - 27017:27017
        volumes:
            - mongo-data:/data/db
        restart: always

    mongo-seed:
        build:
            context: .
            dockerfile: Dockerfile.local.mongo-seed

        depends_on:
            - mongodb
        restart: on-failure
        

    nginx:
        image: nginx
        volumes:
            - ./nginx-local.conf:/etc/nginx/conf.d/nginx.conf:ro
        ports:
            - '3001:3001'
            - '3002:3002'
        # webapp/backend run on the host in local dev (not in this compose
        # network), so nginx-local.conf proxies to host.docker.internal rather
        # than localhost (which inside this container means the container
        # itself). host-gateway is required explicitly on Linux — Docker
        # Desktop adds it automatically, but this doesn't.
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    # Local email testing: captures all outgoing mail (OTP codes, invites).
    # Host ports 1026/8026 are used to avoid clashing with any other Mailpit
    # already running on the default 1025/8025. Point MAIL_SMTP_SERVER=localhost
    # MAIL_SMTP_PORT=1026; open the web inbox at http://localhost:8026
    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        ports:
            - '1026:1025'
            - '8026:8025'
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 'true'
            MP_SMTP_AUTH_ALLOW_INSECURE: 'true'

    # S3-compatible object storage (file uploads, media library, workspace
    # images). The backend's AWSS3Service points here via AWS_* env vars:
    #   AWS_ENDPOINT_URL=http://localhost:9000  AWS_REGION=us-east-1
    #   AWS_ACCESS_KEY_ID=rustfsadmin           AWS_SECRET_ACCESS_KEY=rustfsadmin
    #   AWS_BUCKET=bettercollected
    # Local-only credentials — deployments must override with real secrets.
    rustfs:
        image: rustfs/rustfs:latest
        restart: unless-stopped
        ports:
            - '9000:9000'
        environment:
            RUSTFS_ACCESS_KEY: rustfsadmin
            RUSTFS_SECRET_KEY: rustfsadmin
            RUSTFS_VOLUMES: /data
        volumes:
            - rustfs-data:/data

    # Self-hosted product analytics (see plans/umami-self-hosted-form-analytics.md).
    # Admin UI: http://localhost:3003 — default login admin/umami, change it, then
    # create a website and copy its id into backend UMAMI_WEBSITE_ID and webapp
    # UMAMI_WEBSITE_ID. backend/webapp run on the host here (not in compose), so
    # they reach Umami via http://localhost:3003, not the internal service name.
    umami-postgresql:
        image: postgres:15-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: umami
            POSTGRES_USER: umami
            POSTGRES_PASSWORD: umami
        volumes:
            - umami-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
            interval: 5s
            timeout: 5s
            retries: 5

    umami:
        image: ghcr.io/umami-software/umami:postgresql-latest
        restart: unless-stopped
        ports:
            - '3003:3000'
        environment:
            DATABASE_URL: postgresql://umami:umami@umami-postgresql:5432/umami
            # Local-only placeholder — deployment must override with a real secret.
            APP_SECRET: local-dev-only-umami-app-secret
        depends_on:
            umami-postgresql:
                condition: service_healthy

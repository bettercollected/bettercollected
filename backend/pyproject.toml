[project]
name = "backend"
version = "0.1.0"
description = "Backend for bettercollected"
readme = "README.md"
authors = [{ name = "Bibishan Pandey", email = "bibishan.b.pandey@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.50.2",
    "python-dotenv>=1.2.1",
    "aiohttp>=3.14.3",
    "pycryptodome>=3.23.0",
    "base58>=2.1.1",
    "fastapi-mail>=1.6.1",
    "loguru>=0.7.3",
    "requests>=2.32.5",
    "fastapi-camelcase>=2.0.0",
    "fastapi-utils>=0.8.0",
    "beanie>=2.1.0",
    "dependency-injector>=4.49.1",
    "httpx>=0.28.1",
    "classy-fastapi==0.7.0",
    "pyjwt>=2.11.0",
    "boto3>=1.43.40",
    "python-multipart>=0.0.22",
    "cryptography>=50.0.0",
    "apscheduler>=3.11.3",
    "fastapi-pagination>=0.15.10",
    "python-whois>=0.9.6",
    "camel-converter>=5.1.0",
    "sentry-sdk[fastapi]>=2.64.0",
    "temporalio>=1.30.0",
    "elastic-apm>=6.26.2",
    "common",
    "openai>=2.44.0",
    "google-generativeai>=0.8.0",
    "typing-inspect>=0.9.0",
    "pymongo>=4.17.0",
    "pydantic-settings>=2.13.0",
    "mcp>=1.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "aioresponses>=0.7.9",
    "httpx>=0.28.1",
]

[tool.uv.sources]
common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Share a single session-scoped event loop so the session-scoped app/DB fixtures
# (see tests/conftest.py) stay valid across every test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

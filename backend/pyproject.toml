[project]
name = "backend"
version = "0.1.0"
description = "Backend for bettercollected"
readme = "README.md"
authors = [{ name = "Bibishan Pandey", email = "bibishan.b.pandey@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.40.0",
    "python-dotenv>=1.2.1",
    "aiohttp>=3.13.3",
    "pycryptodome>=3.23.0",
    "base58>=2.1.1",
    "fastapi-mail>=1.6.1",
    "loguru>=0.7.3",
    "requests>=2.32.5",
    "fastapi-camelcase>=2.0.0",
    "fastapi-utils>=0.8.0",
    "beanie>=2.0.1",
    "dependency-injector>=4.48.3",
    "httpx>=0.28.1",
    "classy-fastapi==0.6.1",
    "pyjwt>=2.11.0",
    "boto3>=1.42.49",
    "python-multipart>=0.0.22",
    "cryptography>=46.0.5",
    "apscheduler>=3.11.2",
    "fastapi-pagination>=0.15.10",
    "python-whois>=0.9.6",
    "camel-converter>=5.0.0",
    "sentry-sdk[fastapi]>=2.52.0",
    "temporalio>=1.22.0",
    "mongomock-motor>=0.0.33",
    "elastic-apm>=6.25.0",
    "common",
    "openai>=2.21.0",
    "typing-inspect>=0.9.0",
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "pydantic-settings>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "aioresponses>=0.7.8",
    "httpx>=0.28.1",
]

[tool.uv.sources]
common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Alembic for the admin service's schema (`admin`): its own history and version
# table. Migrations run as the migration role (bc_admin_mig), never the runtime
# role; DATABASE_URL is that role's URL.
#   /api/backend/.venv/bin/alembic -c /api/backend/backend/admin/alembic.ini upgrade head   (in the image; deploy.sh does this)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../..
path_separator = os
file_template = %%(rev)s
# sqlalchemy.url is intentionally empty: env.py reads DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
